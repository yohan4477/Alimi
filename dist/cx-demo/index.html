:00:00+09:00", "message_ids": ["t13_m01", "t13_m02", "t13_m03", "t13_m04", "t13_m05", "t13_m06", "t13_m07"], "is_synthetic": true}, {"id": "t14", "title": "헤어에센스·오일·리브인 트리트먼트 셋 다 필요?", "category": "헤어케어", "author_id": "u11", "created_at": "2026-10-21T00:00:00+09:00", "message_ids": ["t14_m01", "t14_m02", "t14_m03", "t14_m04", "t14_m05", "t14_m06", "t14_m07", "t14_m08", "t14_m09", "t14_m10", "t14_m11"], "is_synthetic": true}, {"id": "t15", "title": "브로우 펜슬·파우더·카라, 눈썹 없는 쪽만 진해져요", "category": "아이브로우", "author_id": "u12", "created_at": "2026-10-21T07:00:00+09:00", "message_ids": ["t15_m01", "t15_m02", "t15_m03", "t15_m04", "t15_m05", "t15_m06", "t15_m07", "t15_m08", "t15_m09"], "is_synthetic": true}, {"id": "t16", "title": "저렴한 립펜슬 vs 고가 립펜슬: 지속력 차이 있어요?", "category": "가격 비교", "author_id": "u10", "created_at": "2026-10-21T14:00:00+09:00", "message_ids": ["t16_m01", "t16_m02", "t16_m03", "t16_m04", "t16_m05", "t16_m06", "t16_m07", "t16_m08", "t16_m09"], "is_synthetic": true}], "messages": [{"id": "t01_m01", "thread_id": "t01", "user_id": "u01", "text": "원래 입술 색이 좀 어둡고 각질이 많아요. 오늘 소개팅인데 베이스까지 다 하고 립만 바르면 입술이 유독 둥둥 떠 보여요. 진한 장미색은 얼굴이 피곤해 보이고, 연한 누드는 거의 안 보여요. 촉촉한 틴트랑 매트 립 중 뭐가 더 나을까요?", "reply_to_id": null, "created_at": "2026-10-15T18:00:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t01_m02", "thread_id": "t01", "user_id": "u02", "text": "저도 입술색 어두운데 너무 연한 색을 바르면 오히려 회색처럼 보여요. 베이스를 아주 조금만 누르고 맑은 로즈 계열 올리는 쪽이 괜찮았어요.", "reply_to_id": "t01_m01", "created_at": "2026-10-15T18:12:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t01_m03", "thread_id": "t01", "user_id": "u01", "text": "입술 베이스를 컨실러로 덮는다는 말인가요? 제가 그렇게 했다가 경계선이 생긴 적이 있거든요.", "reply_to_id": "t01_m02", "created_at": "2026-10-15T18:18:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t01_m04", "thread_id": "t01", "user_id": "u02", "text": "완전히 덮지는 말고 입술 바깥 라인에 남은 쿠션만 살짝요. 가운데는 원래 입술색 남겨 두는 편이에요.", "reply_to_id": "t01_m03", "created_at": "2026-10-15T18:23:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t01_m05", "thread_id": "t01", "user_id": "u04", "text": "저는 정반대예요. 컨실러 조금만 묻어도 각질이 더 보여서 립밤 닦고 틴트 얇게 두 번이 낫더라고요.", "reply_to_id": "t01_m01", "created_at": "2026-10-15T18:31:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t01_m06", "thread_id": "t01", "user_id": "u03", "text": "여기 갑자기 들어왔는데 소개팅 립 고르는 방 맞나요? 쿨톤 추천만 모으는 건지 궁금해요.", "reply_to_id": null, "created_at": "2026-10-15T18:39:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t01_m07", "thread_id": "t01", "user_id": "u01", "text": "맞아요 ㅋㅋ 제가 오늘 바를 립 고민 중이고 피부톤 상관없이 경험 듣고 있어요!", "reply_to_id": "t01_m06", "created_at": "2026-10-15T18:42:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t01_m08", "thread_id": "t01", "user_id": "u03", "text": "그럼 지속력도 중요하겠네요. 밥 먹으면 없어지는 촉촉한 립은 어떻게 해요?", "reply_to_id": "t01_m07", "created_at": "2026-10-15T18:47:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t01_m09", "thread_id": "t01", "user_id": "u06", "text": "저는 약속 때 무조건 착색 틴트 얇게 바르고 투명 글로스만 챙겨요. 지워져도 가운데 색은 남아요.", "reply_to_id": "t01_m08", "created_at": "2026-10-15T18:54:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t01_m10", "thread_id": "t01", "user_id": "u04", "text": "근데 착색이 얼룩지는 제품도 많아서 테스트 못 했으면 오늘은 익숙한 립이 안전할 듯해요.", "reply_to_id": "t01_m09", "created_at": "2026-10-15T19:02:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t01_m11", "thread_id": "t01", "user_id": "u01", "text": "다들 말 듣고 새 제품 도전은 안 하기로 했어요. 집에 있던 로즈 틴트 얇게 바르고 글로스만 챙겨 갈게요. 끝나고 알려 드릴게요.", "reply_to_id": "t01_m10", "created_at": "2026-10-15T19:08:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t01_m12", "thread_id": "t01", "user_id": "u08", "text": "사진 없는데도 댓글 읽으니까 상황이 그려져요ㅋㅋ 잘 다녀오세요!", "reply_to_id": "t01_m11", "created_at": "2026-10-15T19:12:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t01_m13", "thread_id": "t01", "user_id": "u01", "text": "후기! 밥 먹고 나서는 안쪽만 조금 남았지만 민망한 정도는 아니었고, 글로스 덕분에 각질도 덜 보였어요. 조언 고마워요.", "reply_to_id": "t01_m11", "created_at": "2026-10-17T19:40:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t01_m14", "thread_id": "t01", "user_id": "u03", "text": "후기까지 와서 남겨 주는 거 좋다 ㅋㅋ 저도 이번 주말에 비슷하게 해 볼게요.", "reply_to_id": "t01_m13", "created_at": "2026-10-17T20:14:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t02_m01", "thread_id": "t02", "user_id": "u05", "text": "토요일 낮에 야외 졸업사진을 찍어요. T존은 유분이 올라오고 볼은 쉽게 마르는데, A 쿠션은 처음에 예쁘지만 오후에 코 옆이 갈라지고 B 쿠션은 덜 무너지지만 너무 매트해 보여요. 사진 찍기 3시간 전에 화장한다고 할 때 어떤 쪽이 나을까요?", "reply_to_id": null, "created_at": "2026-10-16T03:00:00+09:00", "is_synthetic": true, "attachments": [{"id": "t02_photo1", "kind": "demo_placeholder", "alt": "비교용 가상 사진 1", "asset_url": null}, {"id": "t02_photo2", "kind": "demo_placeholder", "alt": "비교용 가상 사진 2", "asset_url": null}, {"id": "t02_photo3", "kind": "demo_placeholder", "alt": "비교용 가상 사진 3", "asset_url": null}]}, {"id": "t02_m02", "thread_id": "t02", "user_id": "u07", "text": "저는 비슷한 피부인데 촬영 날은 지속력 우선이라 B에 볼만 미스트 아주 조금 썼어요.", "reply_to_id": "t02_m01", "created_at": "2026-10-16T03:08:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t02_m03", "thread_id": "t02", "user_id": "u06", "text": "볼이 건조하면 B는 사진에서 각질이 더 잡히지 않아요? 저는 오히려 A 얇게 두드리고 중간에 기름종이 썼어요.", "reply_to_id": "t02_m01", "created_at": "2026-10-16T03:20:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t02_m04", "thread_id": "t02", "user_id": "u05", "text": "이게 고민인 게 카메라 플래시에서도 다르게 보일까요?", "reply_to_id": "t02_m03", "created_at": "2026-10-16T03:26:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t02_m05", "thread_id": "t02", "user_id": "u08", "text": "자연광인지 플래시인지부터 확인해 보세요. 둘 다 턱 한쪽씩 발라서 휴대폰 후면 카메라로 3시간 뒤 찍는 게 제일 확실했어요.", "reply_to_id": "t02_m04", "created_at": "2026-10-16T03:36:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t02_m06", "thread_id": "t02", "user_id": "u09", "text": "아 이 방 A/B가 브랜드 이름인가요? 저는 검색으로 들어왔는데 어떤 쿠션인지 모르겠어요.", "reply_to_id": null, "created_at": "2026-10-16T03:49:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t02_m07", "thread_id": "t02", "user_id": "u05", "text": "브랜드는 아직 가렸어요. 제품 홍보처럼 보일까봐요. A는 촉촉한 글로우 타입, B는 세미매트 타입이에요.", "reply_to_id": "t02_m06", "created_at": "2026-10-16T03:55:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t02_m08", "thread_id": "t02", "user_id": "u09", "text": "아하. 그럼 비교 사진이나 정확한 제품명도 접혀서 볼 수 있으면 좋겠어요.", "reply_to_id": "t02_m07", "created_at": "2026-10-16T03:59:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t02_m09", "thread_id": "t02", "user_id": "u07", "text": "저도 동의해요. 사실 제품명 모르면 저랑 똑같은 제품인지 판단이 안 돼요.", "reply_to_id": "t02_m08", "created_at": "2026-10-16T04:04:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t02_m10", "thread_id": "t02", "user_id": "u05", "text": "지금 시험 발라 봤는데 3시간 후 A는 코 옆 끼임, B는 볼 들뜸이 보여요. 일단 B를 볼에 아주 얇게 해 보려고요.", "reply_to_id": "t02_m08", "created_at": "2026-10-16T06:40:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t02_m11", "thread_id": "t02", "user_id": "u06", "text": "B를 눈 아래에는 여러 번 올리지 마세요. 사진 확대하면 거기가 특히 두꺼워 보여요.", "reply_to_id": "t02_m10", "created_at": "2026-10-16T07:10:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t02_m12", "thread_id": "t02", "user_id": "u05", "text": "촬영 후 업데이트: B를 얇게 바르고 건조한 부분에만 베이스를 덜었더니 가까운 사진에서도 크게 들뜨지 않았어요.", "reply_to_id": "t02_m11", "created_at": "2026-10-18T03:40:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t03_m01", "thread_id": "t03", "user_id": "u09", "text": "세안하고 토너, 세럼, 크림을 다 바르면 다음 날 볼이 붉어지는데 크림만 쓰면 또 속당김이 있어요. 다들 몇 단계까지 쓰세요? 최근 새로 바꾼 건 세럼 하나뿐이에요.", "reply_to_id": null, "created_at": "2026-10-16T12:00:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t03_m02", "thread_id": "t03", "user_id": "u04", "text": "저도 비슷했어요. 새 세럼을 잠깐 빼고 이전 루틴과 비교해 보는 게 원인 찾기엔 낫지 않을까요?", "reply_to_id": "t03_m01", "created_at": "2026-10-16T12:09:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t03_m03", "thread_id": "t03", "user_id": "u11", "text": "저는 2단계가 편했어요. 토너 생략하고 크림을 나눠서 발랐고요. 다만 피부마다 달라요.", "reply_to_id": "t03_m01", "created_at": "2026-10-16T12:21:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t03_m04", "thread_id": "t03", "user_id": "u09", "text": "일단 세럼 사용을 중단하고 경과를 보려 해요. 자극이 계속되면 피부과 상담할게요.", "reply_to_id": "t03_m02", "created_at": "2026-10-16T12:29:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t03_m05", "thread_id": "t03", "user_id": "u10", "text": "검색하다 왔어요. 여기는 제품 추천방이에요, 아니면 루틴 얘기하는 방이에요?", "reply_to_id": null, "created_at": "2026-10-16T12:46:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t03_m06", "thread_id": "t03", "user_id": "u04", "text": "지금은 루틴 얘기 쪽이에요. 제품 추천보다 민감할 때 어떤 순서로 쓰는지 경험 공유하는 중!", "reply_to_id": "t03_m05", "created_at": "2026-10-16T12:52:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t03_m07", "thread_id": "t03", "user_id": "u10", "text": "오 고마워요. 그럼 저도 저녁 세안 뒤 크림 하나만 써 본 경험 남겨 볼게요.", "reply_to_id": "t03_m06", "created_at": "2026-10-16T12:58:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t03_m08", "thread_id": "t03", "user_id": "u09", "text": "3일 뒤 후기: 붉은기 많이 줄었어요. 정확한 원인은 아직 몰라서 제품을 한 번에 여러 개 바꾸진 않으려고요.", "reply_to_id": "t03_m04", "created_at": "2026-10-19T12:10:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t04_m01", "thread_id": "t04", "user_id": "u03", "text": "실내 콘서트인데 뛰면 엄청 땀이 나요. 언더 마스카라가 꼭 번지는데 픽서를 먼저 써야 할까요?", "reply_to_id": null, "created_at": "2026-10-16T21:00:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t04_m02", "thread_id": "t04", "user_id": "u12", "text": "저는 언더를 아예 포기했어요 ㅋㅋ 대신 뷰러만 했어요.", "reply_to_id": "t04_m01", "created_at": "2026-10-16T21:15:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t04_m03", "thread_id": "t04", "user_id": "u03", "text": "그것도 방법이겠네요. 윗속눈썹은 괜찮았어요?", "reply_to_id": "t04_m02", "created_at": "2026-10-16T21:19:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t04_m04", "thread_id": "t04", "user_id": "u12", "text": "윗부분은 크게 안 번졌는데 개인차 있을 거예요.", "reply_to_id": "t04_m03", "created_at": "2026-10-16T21:27:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t04_m05", "thread_id": "t04", "user_id": "u07", "text": "저는 땀이 많아서 그냥 안 바르는 편이에요.", "reply_to_id": "t04_m01", "created_at": "2026-10-16T21:41:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t05_m01", "thread_id": "t05", "user_id": "u10", "text": "같은 제품인데 공식 사진은 말린 장미처럼 보이고 후기 사진은 형광 핑크처럼 보여요. 매장 갈 시간도 없는데 이런 경우 뭘 기준으로 골라요?", "reply_to_id": null, "created_at": "2026-10-17T06:00:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t06_m01", "thread_id": "t06", "user_id": "u08", "text": "하루 종일 걸을 여행이라 덧바르기 편한 걸 찾고 있어요. 눈이 쉽게 따가운 편이라 백탁보다 눈시림이 더 중요해요. 스틱과 로션 중 뭘 챙길까요?", "reply_to_id": null, "created_at": "2026-10-17T15:00:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t06_m02", "thread_id": "t06", "user_id": "u05", "text": "스틱은 편했지만 저는 충분히 바른 건지 판단하기 어려웠어요. 로션을 기본으로 쓰고 덧바를 때 편한 방식을 고르는 편이에요.", "reply_to_id": "t06_m01", "created_at": "2026-10-17T15:24:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t06_m03", "thread_id": "t06", "user_id": "u08", "text": "아 그러면 로션 기본에 작은 제품 휴대하는 쪽으로 생각해 볼게요.", "reply_to_id": "t06_m02", "created_at": "2026-10-17T15:35:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t07_m01", "thread_id": "t07", "user_id": "u07", "text": "아침에 자연스러웠는데 학교 조명 아래서는 양 볼이 너무 빨개 보여요. 이미 파우더까지 했는데 어떻게 줄여요?", "reply_to_id": null, "created_at": "2026-10-18T00:00:00+09:00", "is_synthetic": true, "attachments": [{"id": "t07_photo1", "kind": "demo_placeholder", "alt": "비교용 가상 사진 1", "asset_url": null}, {"id": "t07_photo2", "kind": "demo_placeholder", "alt": "비교용 가상 사진 2", "asset_url": null}]}, {"id": "t07_m02", "thread_id": "t07", "user_id": "u02", "text": "아무것도 더 안 올리고 깨끗한 퍼프로 경계만 두드리면 조금 누그러졌어요.", "reply_to_id": "t07_m01", "created_at": "2026-10-18T00:12:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t08_m01", "thread_id": "t08", "user_id": "u11", "text": "제품명이 '글로시 워터 벨벳 하이드레이팅 립 컬러 리미티드 에디션 03 더스티 피치 로즈'처럼 길어요. 앞부분만 치면 비슷한 게 너무 많이 나오는데 색상 호수까지 정확하게 찾을 방법 없나요?", "reply_to_id": null, "created_at": "2026-10-18T09:00:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t08_m02", "thread_id": "t08", "user_id": "u01", "text": "저는 호수부터 검색해요. 그런데 03만 치면 다른 브랜드도 나와서 브랜드 필터 있으면 좋겠어요.", "reply_to_id": "t08_m01", "created_at": "2026-10-18T09:11:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t08_m03", "thread_id": "t08", "user_id": "u11", "text": "맞아요. 긴 이름은 제목에서 다 잘리고 뒤에 있는 호수가 안 보여요.", "reply_to_id": "t08_m02", "created_at": "2026-10-18T09:17:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t09_m01", "thread_id": "t09", "user_id": "u03", "text": "여드름 흔적 때문에 베이스를 여러 겹 올리면 오히려 요철이 강조돼요. 컨실러, 커버 쿠션, 초록색 코렉터 중 뭐부터 써야 자연스러울까요? 붉은 자국이고 아직 완전히 가라앉지 않은 부분도 있어요.", "reply_to_id": null, "created_at": "2026-10-19T13:13:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t09_m02", "thread_id": "t09", "user_id": "u05", "text": "붉은 자국에는 저는 코렉터를 정말 아주 얇게 쓰고 컨실러를 점으로 올려요. 쿠션만 겹치면 볼 전체가 두꺼워졌어요.", "reply_to_id": "t09_m01", "created_at": "2026-10-19T13:26:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t09_m03", "thread_id": "t09", "user_id": "u11", "text": "코렉터가 회색으로 뜨던데요? 저는 보습하고 스팟 컨실러만 발라요.", "reply_to_id": "t09_m01", "created_at": "2026-10-19T13:39:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t09_m04", "thread_id": "t09", "user_id": "u03", "text": "컨실러는 브러시랑 손가락 중 뭐가 덜 두꺼워져요?", "reply_to_id": "t09_m02", "created_at": "2026-10-19T13:52:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t09_m05", "thread_id": "t09", "user_id": "u05", "text": "작은 브러시로 놓고 경계만 손가락으로 톡톡 했어요. 바로 문지르면 지워져요.", "reply_to_id": "t09_m04", "created_at": "2026-10-19T14:05:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t09_m06", "thread_id": "t09", "user_id": "u09", "text": "뒤늦게 들어왔는데 붉은 자국 이야기인가요, 현재 올라온 트러블 이야기인가요? 둘은 다르게 접근해야 할 것 같아서요.", "reply_to_id": null, "created_at": "2026-10-19T14:18:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t09_m07", "thread_id": "t09", "user_id": "u03", "text": "둘 다요. 그래서 오히려 커버가 어려웠던 것 같아요.", "reply_to_id": "t09_m06", "created_at": "2026-10-19T14:31:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t09_m08", "thread_id": "t09", "user_id": "u04", "text": "예민하고 아픈 부위는 화장품으로 계속 덮다가 자극되기도 해서 조심해요. 저는 그런 날에는 무리해서 커버하지 않아요.", "reply_to_id": "t09_m07", "created_at": "2026-10-19T14:44:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t09_m09", "thread_id": "t09", "user_id": "u11", "text": "저는 쿠션을 얇게 한 번 바르고 오래된 자국만 컨실러로 처리하는 쪽에 한 표.", "reply_to_id": "t09_m01", "created_at": "2026-10-19T14:57:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t09_m10", "thread_id": "t09", "user_id": "u03", "text": "오늘 시험해 보니 코렉터는 양 조절이 어렵네요. 내일은 스팟 컨실러만 해 볼게요.", "reply_to_id": "t09_m09", "created_at": "2026-10-19T15:10:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t09_m11", "thread_id": "t09", "user_id": "u05", "text": "나중에 지속력 후기도 알려 주세요! 저는 오후에 그 부분만 지워지더라고요.", "reply_to_id": "t09_m10", "created_at": "2026-10-20T15:23:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t09_m12", "thread_id": "t09", "user_id": "u03", "text": "다음 날 후기: 코렉터 빼니까 회색 뜨는 건 줄었어요. 대신 커버력은 조금 포기했어요.", "reply_to_id": "t09_m11", "created_at": "2026-10-20T15:36:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t10_m01", "thread_id": "t10", "user_id": "u07", "text": "아침 8시에 바르고 점심을 먹어요. 립오일은 예쁜데 금방 사라지고, 글로스는 머리카락 붙고, 틴트는 오후에 건조해져요. 하나만 파우치에 넣으면 뭐가 좋아요?", "reply_to_id": null, "created_at": "2026-10-19T20:13:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t10_m02", "thread_id": "t10", "user_id": "u10", "text": "저는 틴트요. 점심 전에 다시 바르면 되고 가방에 넣어도 잘 안 새요.", "reply_to_id": "t10_m01", "created_at": "2026-10-19T20:26:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t10_m03", "thread_id": "t10", "user_id": "u02", "text": "저는 글로스! 머리카락 묶으면 생각보다 괜찮고 입술이 편해서요.", "reply_to_id": "t10_m01", "created_at": "2026-10-19T20:39:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t10_m04", "thread_id": "t10", "user_id": "u07", "text": "립오일이랑 글로스는 사실 뭐가 달라요? 광택은 비슷해 보이던데.", "reply_to_id": "t10_m03", "created_at": "2026-10-19T20:52:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t10_m05", "thread_id": "t10", "user_id": "u02", "text": "제품마다 다르지만 저는 립오일 쪽이 더 묽고 글로스는 더 쫀득한 느낌이었어요.", "reply_to_id": "t10_m04", "created_at": "2026-10-19T21:05:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t10_m06", "thread_id": "t10", "user_id": "u08", "text": "이 방 인기글에서 보고 왔는데 브랜드별 비교도 있나요? 제목에는 종류만 있어서요.", "reply_to_id": null, "created_at": "2026-10-19T21:18:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t10_m07", "thread_id": "t10", "user_id": "u07", "text": "아직 제품명은 안 정했어요. 실제로 쓴 사람들 얘기 듣고 종류부터 고르려고요.", "reply_to_id": "t10_m06", "created_at": "2026-10-19T21:31:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t10_m08", "thread_id": "t10", "user_id": "u01", "text": "립오일은 투명한 걸 하나 갖고 있으면 틴트 위에 쓰기도 좋긴 해요. 근데 하나만이면 색 있는 틴트가 무난할 듯.", "reply_to_id": "t10_m01", "created_at": "2026-10-19T21:44:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t10_m09", "thread_id": "t10", "user_id": "u10", "text": "맞아요. 점심 먹고 거울 안 보면 광택류는 거의 없을 수도 있어요.", "reply_to_id": "t10_m08", "created_at": "2026-10-20T21:57:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t10_m10", "thread_id": "t10", "user_id": "u07", "text": "결론은 하나만 가져간다면 익숙한 틴트! 대신 오늘 저녁에는 글로스도 시험해 볼래요.", "reply_to_id": "t10_m09", "created_at": "2026-10-20T22:10:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t11_m01", "thread_id": "t11", "user_id": "u08", "text": "야외 페스티벌에서 선크림을 덧발라야 해요. 무기자차는 백탁이 있고 유기자차는 눈 주위가 불편한 경험이 있고 선스틱은 덜 발린 것 같아요. 다들 어떤 조합으로 사용해요?", "reply_to_id": null, "created_at": "2026-10-20T03:13:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t11_m02", "thread_id": "t11", "user_id": "u12", "text": "저는 아침에는 평소 쓰던 로션형으로 충분히 바르고 덧바를 때도 로션형을 써요.", "reply_to_id": "t11_m01", "created_at": "2026-10-20T03:26:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t11_m03", "thread_id": "t11", "user_id": "u05", "text": "메이크업 위면 로션을 덧바르기 어렵지 않아요? 저는 스틱을 들고 다녔는데 정말 충분한지는 모르겠어요.", "reply_to_id": "t11_m02", "created_at": "2026-10-20T03:39:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t11_m04", "thread_id": "t11", "user_id": "u12", "text": "저는 그날 메이크업을 거의 안 해요. 메이크업 있는 날과 없는 날을 나눠야겠네요.", "reply_to_id": "t11_m03", "created_at": "2026-10-20T03:52:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t11_m05", "thread_id": "t11", "user_id": "u04", "text": "눈 시림은 제품마다 달라서 무기/유기만으로 나누기는 어렵더라고요.", "reply_to_id": "t11_m01", "created_at": "2026-10-20T04:05:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t11_m06", "thread_id": "t11", "user_id": "u06", "text": "여기 선스틱 브랜드 추천하는 방이에요? 우연히 들어왔어요.", "reply_to_id": null, "created_at": "2026-10-20T04:18:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t11_m07", "thread_id": "t11", "user_id": "u08", "text": "아니요 ㅋㅋ 덧바르기 방식 이야기 중이에요. 브랜드 추천도 좋지만 사용 상황도 알려 주세요.", "reply_to_id": "t11_m06", "created_at": "2026-10-20T04:31:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t11_m08", "thread_id": "t11", "user_id": "u06", "text": "그러면 저는 야외에서 땀이 많아서 수건으로 닦은 후 로션형을 다시 발랐어요.", "reply_to_id": "t11_m07", "created_at": "2026-10-20T04:44:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t11_m09", "thread_id": "t11", "user_id": "u05", "text": "땀 닦을 때 메이크업도 지워지니까 결국 편의성이 문제네요.", "reply_to_id": "t11_m08", "created_at": "2026-10-21T04:57:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t11_m10", "thread_id": "t11", "user_id": "u08", "text": "이번에는 모자도 챙기고 로션형을 휴대할게요. 일단 현재 루틴에서 크게 안 바꾸는 쪽으로!", "reply_to_id": "t11_m09", "created_at": "2026-10-21T05:10:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t12_m01", "thread_id": "t12", "user_id": "u06", "text": "같은 피치 계열인데 크림은 자연스러운데 금방 사라지고 리퀴드는 한 번 잘못 찍으면 너무 진하고 파우더는 볼이 건조해 보여요. 베이스가 촉촉한 사람은 어떤 게 좋아요?", "reply_to_id": null, "created_at": "2026-10-20T10:13:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t12_m02", "thread_id": "t12", "user_id": "u01", "text": "저는 리퀴드를 손등에 먼저 덜고 퍼프에 소량 묻히니까 조절되더라고요.", "reply_to_id": "t12_m01", "created_at": "2026-10-20T10:26:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t12_m03", "thread_id": "t12", "user_id": "u11", "text": "건성이면 크림 추천하는 편이지만 지속력은 제품마다 차이 커요.", "reply_to_id": "t12_m01", "created_at": "2026-10-20T10:39:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t12_m04", "thread_id": "t12", "user_id": "u06", "text": "퍼프로 하면 쿠션이 지워지지 않나요?", "reply_to_id": "t12_m02", "created_at": "2026-10-20T10:52:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t12_m05", "thread_id": "t12", "user_id": "u01", "text": "막 문지르면 지워져서 작은 퍼프로 누르듯이 했어요.", "reply_to_id": "t12_m04", "created_at": "2026-10-20T11:05:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t12_m06", "thread_id": "t12", "user_id": "u09", "text": "여기 사진 세 장 중 첫 번째가 크림인가요? 사진 순서가 잘 안 보여요.", "reply_to_id": null, "created_at": "2026-10-20T11:18:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t12_m07", "thread_id": "t12", "user_id": "u06", "text": "아직 사진 첨부 전이에요. 비교 사진이 있으면 한 번에 보여드릴게요.", "reply_to_id": "t12_m06", "created_at": "2026-10-20T11:31:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t12_m08", "thread_id": "t12", "user_id": "u02", "text": "저는 파우더가 더 오래갔어요. 피부가 다르니 누가 맞다고 못 하겠네요.", "reply_to_id": "t12_m01", "created_at": "2026-10-20T11:44:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t12_m09", "thread_id": "t12", "user_id": "u06", "text": "그럼 왼쪽 볼 크림, 오른쪽 볼 파우더로 반나절 비교해 보려고요.", "reply_to_id": "t12_m08", "created_at": "2026-10-20T11:57:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t12_m10", "thread_id": "t12", "user_id": "u06", "text": "결과: 제 피부에서는 크림 쪽이 덜 건조해 보였지만 오후엔 거의 없어졌어요. 파우더는 색은 남았는데 결이 조금 보였어요.", "reply_to_id": "t12_m09", "created_at": "2026-10-21T12:10:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t12_m11", "thread_id": "t12", "user_id": "u02", "text": "이런 비교 후기 진짜 도움 돼요. 같은 조명 사진도 나중에 있으면 좋겠어요.", "reply_to_id": "t12_m10", "created_at": "2026-10-21T12:23:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t13_m01", "thread_id": "t13", "user_id": "u02", "text": "강의실이 좁아서 향수는 주변 사람에게 강할까 걱정돼요. 바디미스트나 향 있는 핸드크림 정도면 괜찮을까요? 달콤한 향을 좋아하지만 오래 남는 향이 부담스러워요.", "reply_to_id": null, "created_at": "2026-10-20T17:13:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t13_m02", "thread_id": "t13", "user_id": "u09", "text": "향 있는 제품도 가까운 사람에게는 강할 수 있어요. 저는 좁은 공간에선 무향 핸드크림만 써요.", "reply_to_id": "t13_m01", "created_at": "2026-10-20T17:26:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t13_m03", "thread_id": "t13", "user_id": "u05", "text": "바디미스트가 무조건 약한 건 아니더라고요. 뿌리는 양에 따라 달라요.", "reply_to_id": "t13_m01", "created_at": "2026-10-20T17:39:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t13_m04", "thread_id": "t13", "user_id": "u02", "text": "제가 좋아하는 달콤한 향도 호불호가 크겠죠?", "reply_to_id": "t13_m02", "created_at": "2026-10-20T17:52:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t13_m05", "thread_id": "t13", "user_id": "u09", "text": "그럴 수 있어요. 주변 배려하려면 향을 줄이는 선택이 편하죠.", "reply_to_id": "t13_m04", "created_at": "2026-10-20T18:05:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t13_m06", "thread_id": "t13", "user_id": "u10", "text": "검색 타고 왔는데 이 방은 향 추천보다 사용 예절 얘기인가요?", "reply_to_id": null, "created_at": "2026-10-21T18:18:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t13_m07", "thread_id": "t13", "user_id": "u02", "text": "네! 강의실에서 얼마나 조심해야 하나 묻는 중이에요.", "reply_to_id": "t13_m06", "created_at": "2026-10-21T18:31:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t14_m01", "thread_id": "t14", "user_id": "u11", "text": "탈색모인데 머리 끝이 너무 푸석해요. 샤워 후 리브인, 드라이 전 에센스, 마무리 오일을 다 쓰니까 가끔 떡져 보여요. 지금은 어깨 아래 길이고 머리숱은 많은 편이에요.", "reply_to_id": null, "created_at": "2026-10-21T00:13:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t14_m02", "thread_id": "t14", "user_id": "u05", "text": "저는 리브인 하나 쓰고 완전히 말린 뒤 끝에만 오일 한 방울. 세 가지 다 쓰면 오히려 무거웠어요.", "reply_to_id": "t14_m01", "created_at": "2026-10-21T00:26:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t14_m03", "thread_id": "t14", "user_id": "u07", "text": "가느다란 모발은 오일이 금방 떡지던데 숱 많으면 다를 수도 있겠네요.", "reply_to_id": "t14_m01", "created_at": "2026-10-21T00:39:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t14_m04", "thread_id": "t14", "user_id": "u11", "text": "에센스랑 오일의 역할이 같다고 봐도 되나요?", "reply_to_id": "t14_m02", "created_at": "2026-10-21T00:52:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t14_m05", "thread_id": "t14", "user_id": "u05", "text": "제 제품들은 제형이 달랐어요. 성분도 제품마다 다르니 꼭 같은 건 아닐 거예요.", "reply_to_id": "t14_m04", "created_at": "2026-10-21T01:05:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t14_m06", "thread_id": "t14", "user_id": "u08", "text": "이 방이 제품 비교방이면 정확한 이름 알려 주실 수 있나요? 리브인 종류가 너무 많아서요.", "reply_to_id": null, "created_at": "2026-10-21T01:18:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t14_m07", "thread_id": "t14", "user_id": "u11", "text": "리브인은 브랜드 A의 밀크 제형, 에센스는 브랜드 B의 크림, 오일은 브랜드 C의 가벼운 타입이에요. 정리해서 본문에 추가할게요.", "reply_to_id": "t14_m06", "created_at": "2026-10-21T01:31:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t14_m08", "thread_id": "t14", "user_id": "u07", "text": "드라이 열을 자주 쓰는지도 중요하지 않아요? 저는 고온 드라이 날과 자연건조 날이 달랐어요.", "reply_to_id": "t14_m01", "created_at": "2026-10-21T01:44:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t14_m09", "thread_id": "t14", "user_id": "u11", "text": "맞아요. 거의 매일 드라이해서 그 조건을 빼먹었네요.", "reply_to_id": "t14_m08", "created_at": "2026-10-21T01:57:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t14_m10", "thread_id": "t14", "user_id": "u05", "text": "저는 매일 쓰는 것 하나부터 정해 두고 나머지는 필요할 때만 더하는 쪽이에요.", "reply_to_id": "t14_m09", "created_at": "2026-10-22T02:10:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t14_m11", "thread_id": "t14", "user_id": "u11", "text": "이틀 동안 리브인만 사용했는데 머리 끝 엉킴은 덜했고 묵직한 느낌도 줄었어요. 다만 탈색 부분의 푸석함은 남아 있네요.", "reply_to_id": "t14_m10", "created_at": "2026-10-22T02:23:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t15_m01", "thread_id": "t15", "user_id": "u12", "text": "왼쪽 눈썹은 모가 거의 없고 오른쪽은 숱이 많아요. 펜슬로 양쪽 채우면 왼쪽만 너무 그린 티가 나고 브로우카라를 쓰면 오른쪽이 과해 보여요. 균형 잡는 팁 있나요?", "reply_to_id": null, "created_at": "2026-10-21T07:13:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t15_m02", "thread_id": "t15", "user_id": "u01", "text": "저는 숱 많은 쪽부터 모양을 정하고 없는 쪽은 펜슬로 점처럼 채웠어요.", "reply_to_id": "t15_m01", "created_at": "2026-10-21T07:26:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t15_m03", "thread_id": "t15", "user_id": "u03", "text": "파우더는 경계가 부드러워지는데 지속력이 약한 느낌이었어요.", "reply_to_id": "t15_m01", "created_at": "2026-10-21T07:39:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t15_m04", "thread_id": "t15", "user_id": "u12", "text": "비 오는 날에는 파우더가 쉽게 지워질까요?", "reply_to_id": "t15_m03", "created_at": "2026-10-21T07:52:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t15_m05", "thread_id": "t15", "user_id": "u03", "text": "제 경우에는 땀 많이 흘린 날 조금 지워졌어요. 제품 차이도 있을 듯.", "reply_to_id": "t15_m04", "created_at": "2026-10-21T08:05:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t15_m06", "thread_id": "t15", "user_id": "u04", "text": "그냥 지나가다 본 방인데 눈썹 모양 자체가 다를 때도 같은 방법이 통하나요?", "reply_to_id": null, "created_at": "2026-10-21T08:18:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t15_m07", "thread_id": "t15", "user_id": "u12", "text": "저도 궁금해요. 제 경우는 높이도 살짝 달라요.", "reply_to_id": "t15_m06", "created_at": "2026-10-21T08:31:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t15_m08", "thread_id": "t15", "user_id": "u01", "text": "똑같이 맞추는 것보다 전체 인상을 비슷하게 맞추는 게 덜 어색했어요.", "reply_to_id": "t15_m07", "created_at": "2026-10-22T08:44:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t15_m09", "thread_id": "t15", "user_id": "u12", "text": "내일은 파우더로 큰 면부터 맞추고 빈 부분만 펜슬로 채워 볼게요.", "reply_to_id": "t15_m08", "created_at": "2026-10-22T08:57:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t16_m01", "thread_id": "t16", "user_id": "u10", "text": "립펜슬이 6천 원대부터 3만 원대까지 있네요. 누드 로즈 색으로 입술 라인만 살짝 정리할 건데 고가 제품이 확실히 더 오래가요? 건조함도 중요해요.", "reply_to_id": null, "created_at": "2026-10-21T14:13:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t16_m02", "thread_id": "t16", "user_id": "u06", "text": "고가도 건조한 건 건조했어요. 저는 브랜드보다 색이 입술에 맞는지가 더 중요했어요.", "reply_to_id": "t16_m01", "created_at": "2026-10-21T14:26:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t16_m03", "thread_id": "t16", "user_id": "u02", "text": "저가 제품 중에도 잘 맞는 게 있었지만 깎는 과정에서 자꾸 부러져서 번거로웠어요.", "reply_to_id": "t16_m01", "created_at": "2026-10-21T14:39:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t16_m04", "thread_id": "t16", "user_id": "u10", "text": "샤프너 필요한 타입과 돌려 쓰는 타입 중 어느 게 더 편해요?", "reply_to_id": "t16_m03", "created_at": "2026-10-21T14:52:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t16_m05", "thread_id": "t16", "user_id": "u02", "text": "편의성은 돌려 쓰는 게 나았는데 아주 얇게 그릴 때는 깎는 타입이 좋았어요.", "reply_to_id": "t16_m04", "created_at": "2026-10-21T15:05:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t16_m06", "thread_id": "t16", "user_id": "u08", "text": "처음 들어왔는데 실제 특정 제품 두 개를 비교하는 건가요?", "reply_to_id": null, "created_at": "2026-10-21T15:18:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t16_m07", "thread_id": "t16", "user_id": "u10", "text": "아직 후보 찾는 중이에요. 가격대별 경험이 궁금해서요.", "reply_to_id": "t16_m06", "created_at": "2026-10-21T15:31:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t16_m08", "thread_id": "t16", "user_id": "u06", "text": "라인용이면 평소 쓰는 립 컬러와 맞추는 게 우선일 듯해요. 색이 다르면 경계가 확 보였어요.", "reply_to_id": "t16_m07", "created_at": "2026-10-22T15:44:00+09:00", "is_synthetic": true, "attachments": []}, {"id": "t16_m09", "thread_id": "t16", "user_id": "u10", "text": "매장 테스트가 가능하면 직접 색부터 비교해 볼게요. 일단 비싼 게 무조건 답은 아니네요.", "reply_to_id": "t16_m08", "created_at": "2026-10-22T15:57:00+09:00", "is_synthetic": true, "attachments": []}], "activities": [{"user_id": "u01", "type": "saved_thread", "thread_id": "t02"}, {"user_id": "u03", "type": "joined_thread", "thread_id": "t01"}, {"user_id": "u09", "type": "saved_thread", "thread_id": "t03"}, {"user_id": "u05", "type": "joined_thread", "thread_id": "t02"}, {"user_id": "u10", "type": "search", "query": "립 색상 실제 발색", "result_thread_ids": ["t05", "t01"]}, {"user_id": "u11", "type": "search", "query": "존재하지 않는 제품명 ABC-999", "result_thread_ids": []}], "notifications": [{"id": "n01", "recipient_user_id": "u01", "actor_user_id": "u02", "type": "reply", "thread_id": "t01", "message_id": "t01_m04", "read": true, "deep_link": "/demo/threads/t01?comment=t01_m04"}, {"id": "n02", "recipient_user_id": "u01", "actor_user_id": "u03", "type": "thread_activity", "thread_id": "t01", "message_id": "t01_m14", "read": false, "deep_link": "/demo/threads/t01?comment=t01_m14"}, {"id": "n03", "recipient_user_id": "u05", "actor_user_id": "u06", "type": "reply", "thread_id": "t02", "message_id": "t02_m11", "read": false, "deep_link": "/demo/threads/t02?comment=t02_m11"}, {"id": "n04", "recipient_user_id": "u09", "actor_user_id": "u04", "type": "reply", "thread_id": "t03", "message_id": "t03_m02", "read": true, "deep_link": "/demo/threads/t03?comment=t03_m02"}], "test_cases": [{"id": "CX01", "user_id": "u01", "path": ["t01", "n02", "t01_m14"], "checks": ["긴 댓글 스크롤", "재방문 후기 노출", "알림 딥링크"]}, {"id": "CX02", "user_id": "u09", "path": ["t02_m06", "t02_m07", "t02_m08"], "checks": ["맥락 없는 신규 참여", "답변 대상 강조"]}, {"id": "CX03", "user_id": "u05", "path": ["t02", "n03", "t02_m11"], "checks": ["서로 다른 의견", "조건별 비교", "알림에서 원문 복귀"]}, {"id": "CX04", "user_id": "u10", "path": ["t05"], "checks": ["답변 없는 상태"]}, {"id": "CX05", "user_id": "u11", "path": ["search"], "checks": ["0건 검색", "긴 제품명 처리"]}, {"id": "CX06", "user_id": "u03", "path": ["t09", "t09_m06", "t09_m12"], "checks": ["긴 대화", "중간 참여", "서로 다른 방법 비교", "후속 후기"]}, {"id": "CX07", "user_id": "u08", "path": ["t11", "t11_m06", "t11_m07"], "checks": ["처음 참여한 사람의 맥락 이해", "선케어 선택 조건"]}, {"id": "CX08", "user_id": "u11", "path": ["t14", "t14_m11"], "checks": ["다른 제품군 비교", "며칠 뒤 후기"]}, {"id": "CX09", "user_id": "u10", "path": ["t16", "t16_m06"], "checks": ["가격대별 의견 차이", "검색 유입 신규 참여"]}]}</script><script>
const db=JSON.parse(document.getElementById('data').textContent);const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let savedByUser=Object.fromEntries(db.users.map(u=>[u.id,new Set(db.activities.filter(a=>a.type==='saved_thread'&&a.user_id===u.id).map(a=>a.thread_id))]));let state={tab:'home',thread:null,user:'u01',search:'',focus:null,saved:savedByUser['u01'],read:new Set(db.notifications.filter(n=>n.read).map(n=>n.id))};const user=id=>db.users.find(x=>x.id===id)||{nickname:'?'},thread=id=>db.threads.find(x=>x.id===id),msg=id=>db.messages.find(x=>x.id===id),list=id=>db.messages.filter(x=>x.thread_id===id),ts=s=>new Date(s).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'});function nav(tab,id=null,focus=null){state.tab=tab;state.thread=id;state.focus=focus;render();window.scrollTo(0,0);if(tab==='thread')history.replaceState(null,'','#'+id+(focus?'~'+focus:''));else history.replaceState(null,'',location.pathname+location.search);if(focus){requestAnimationFrame(()=>document.getElementById(focus)?.scrollIntoView({block:'center'}))}}function openThread(id,focus){nav('thread',id,focus)}
function threadCard(t){let m=list(t.id),last=m.at(-1);return `<button class="item" data-open="${t.id}"><span class="chip">${esc(t.category)} · ${m.length}개 메시지</span><h3>${esc(t.title)}</h3><p>${esc(m[0]?.text)}</p><div class="meta">${esc(user(t.author_id).nickname)} · 마지막 참여 ${ts(last.created_at)}</div>${m.length>=9?'<span class="pill">긴 대화</span>':''}</button>`}
function detail(){let t=thread(state.thread);if(!t)return '';let m=list(t.id);return `<div class="detailhead"><button class="back" data-tab="home">← 대화 목록</button><div class="chip">${esc(t.category)}</div><h1>${esc(t.title)}</h1><div class="sub">${m.length}개 메시지 · ${new Set(m.map(x=>x.user_id)).size}명 참여</div><div class="tools"><button class="action" data-save="${t.id}">${state.saved.has(t.id)?'♥ 저장됨':'♡ 저장하기'}</button><button class="action" data-copy="${t.id}">링크 복사</button></div></div><div class="context"><strong>처음 들어왔나요? · 이 방의 시작</strong><p>${esc(m[0]?.text||'')}</p><button data-focus="${m[0]?.id}">첫 질문으로 이동 ↗</button></div><div class="divider">대화 흐름 · ${m.length}개</div>${m.map(x=>{let r=msg(x.reply_to_id),photo=(x.attachments||[]).map(a=>`<div class="photo">${esc(a.alt)}<br>이미지 자리표시자</div>`).join('');return `<article id="${x.id}" tabindex="-1" class="post ${state.focus===x.id?'focused':''}"><div class="user">${esc(user(x.user_id).nickname)} <span class="muted small">${ts(x.created_at)}</span></div>${r?`<button class="reply" data-focus="${r.id}">↳ ${esc(user(r.user_id).nickname)}: ${esc(r.text)}</button>`:''}<p>${esc(x.text)}</p>${photo?`<div class="photos">${photo}</div>`:''}<button class="replybtn" data-focus="${x.id}">답글 위치 보기 · ${x.id}</button></article>`}).join('')}<div class="box muted small">데모는 읽기 전용이에요. 실제 작성·전송은 하지 않습니다.</div>`}
function feed(){let q=state.search.trim().toLowerCase(),arr=db.threads.filter(t=>[t.title,t.category,...list(t.id).map(m=>m.text)].some(v=>v.toLowerCase().includes(q)));return `<div class="head"><h1>오늘 무슨 얘기 중이야?</h1><div class="sub">실사용자 데이터가 아닌 UX 평가용 대화입니다.</div><div class="pill">16개 방 · 제품별 의견 비교</div></div><div class="search"><input id="find" aria-label="대화 검색" placeholder="제품·색상·고민 검색" value="${esc(state.search)}"></div><div id="results">${arr.length?arr.map(threadCard).join(''):'<div class="empty">검색 결과가 없어요.<p>다른 제품명이나 고민 키워드를 사용해 보세요.</p></div>'}</div>`}
function mine(){return `<div class="head"><h1>내 활동</h1><div class="sub">가상 사용자 선택에 따라 작성한 대화가 달라집니다.</div><label class="small">사용자 전환 <select id="userselect">${db.users.map(u=>`<option value="${u.id}" ${state.user===u.id?'selected':''}>${esc(u.nickname)}</option>`).join('')}</select></label></div><div class="divider">내가 시작한 대화</div>${db.threads.filter(t=>t.author_id===state.user).map(threadCard).join('')||'<div class="empty">작성한 대화가 없어요.</div>'}<div class="divider">내가 참여한 대화</div>${db.threads.filter(t=>t.author_id!==state.user&&list(t.id).some(m=>m.user_id===state.user)).map(threadCard).join('')||'<div class="empty">참여한 대화가 없어요.</div>'}`}
function notifications(){let rows=db.notifications.filter(n=>n.recipient_user_id===state.user);return `<div class="head"><h1>알림</h1><div class="sub">누르면 해당 답글 위치로 이동합니다.</div></div>${rows.length?rows.map(n=>`<button class="notice ${state.read.has(n.id)?'':'unread'}" data-notif="${n.id}"><strong>${esc(user(n.actor_user_id).nickname)}</strong> 님이 ${n.type==='reply'?'답글을 남겼어요':'대화에 참여했어요'}<p>${esc(thread(n.thread_id)?.title)}</p><small>${esc(msg(n.message_id)?.text||'')}</small></button>`).join(''):'<div class="empty">현재 알림이 없어요.</div>'}`}
function render(){let v=state.tab==='thread'?detail():state.tab==='home'?feed():state.tab==='mine'?mine():state.tab==='notifications'?notifications():`<div class="head"><h1>저장한 대화</h1></div>${db.threads.filter(t=>state.saved.has(t.id)).map(threadCard).join('')||'<div class="empty">저장한 대화가 없어요.</div>'}`;$('#view').innerHTML='<div class="banner">가상 사용자·제품 의견만 포함된 독립형 화면 평가 데모 · 운영 DB 연결 없음</div>'+v;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));}
document.body.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){nav(b.dataset.tab);return}if(b.dataset.open){openThread(b.dataset.open);return}if(b.dataset.save){state.saved.has(b.dataset.save)?state.saved.delete(b.dataset.save):state.saved.add(b.dataset.save);render();return}if(b.dataset.focus){state.focus=b.dataset.focus;document.getElementById(b.dataset.focus)?.scrollIntoView({block:'center',behavior:'smooth'});document.querySelectorAll('.focused').forEach(x=>x.classList.remove('focused'));document.getElementById(b.dataset.focus)?.classList.add('focused');document.getElementById(b.dataset.focus)?.focus({preventScroll:true});return}if(b.dataset.notif){let n=db.notifications.find(x=>x.id===b.dataset.notif);state.read.add(n.id);openThread(n.thread_id,n.message_id);return}if(b.dataset.copy){let s=location.href.split('#')[0]+'#'+b.dataset.copy;try{await navigator.clipboard.writeText(s);b.textContent='복사됨'}catch{b.textContent=s}return}});document.body.addEventListener('input',e=>{if(e.target.id==='find'){state.search=e.target.value;let q=state.search.trim().toLowerCase(),arr=db.threads.filter(t=>[t.title,t.category,...list(t.id).map(m=>m.text)].some(v=>v.toLowerCase().includes(q)));$('#results').innerHTML=arr.length?arr.map(threadCard).join(''):'<div class="empty">검색 결과가 없어요.<p>다른 제품명이나 고민 키워드를 사용해 보세요.</p></div>'}});document.body.addEventListener('change',e=>{if(e.target.id==='userselect'){state.user=e.target.value;state.saved=savedByUser[state.user];render()}});let hash=location.hash.slice(1);db.threads.some(x=>x.id===hash.split('~')[0])?openThread(hash.split('~')[0],hash.split('~')[1]||null):render();
</script></body></html>
