<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>너도 갖고 있어? · Seoul Beauty</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fa;color:#1b1b1b;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}main{max-width:440px;min-height:100dvh;margin:auto;background:#fff;padding:22px}.brand{font-size:20px;font-weight:750}small,.hint{color:#777}h1{font-size:30px;line-height:1.3;margin:34px 0 10px;letter-spacing:-1px}p{margin:8px 0 18px}.product{border-radius:18px;background:#f7f7fa;padding:18px;display:flex;align-items:center;gap:15px;margin:22px 0}.product img{width:92px;height:100px;object-fit:contain;background:white;border-radius:12px}.product strong{display:block;font-size:16px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choices button{font:inherit;border-radius:12px;border:1px solid #ddd;background:white;min-height:68px;padding:12px;cursor:pointer;font-weight:600}.choices button[aria-pressed=true]{border:2px solid #0679ee;background:#eef6ff}button:disabled{opacity:.5}.results{margin:25px 0}.result{margin:14px 0}.line{display:flex;justify-content:space-between}.track{height:9px;background:#f2f2f2;border-radius:10px;overflow:hidden}.fill{height:100%;background:#0786ff;transition:width .3s}.foot{margin-top:34px;font-size:12px;color:#777}.notice{font-size:13px;min-height:25px;color:#555}.hide{display:none}.note-box{margin-top:18px;border-top:1px solid #eee;padding-top:16px}.note-box label{display:block;font-weight:650;margin-bottom:8px}.note-box textarea{width:100%;min-height:82px;border:1px solid #ddd;border-radius:12px;padding:12px;font:inherit;resize:vertical}.note-box button{width:100%;background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px;font:inherit;margin-top:8px}.note-box small{display:block;margin-top:6px}
 .catalog-search{width:100%;font:inherit;padding:12px;border:1px solid #ddd;border-radius:11px}.catalog-list{display:grid;gap:5px;max-height:220px;overflow:auto;margin:8px 0}.catalog-list button{display:flex;gap:8px;align-items:center;text-align:left;width:100%;border:1px solid #e9e9e9;border-radius:8px;padding:8px;background:#fff;font:inherit}.catalog-list img{width:38px;height:43px;object-fit:contain} .catalog-paging{display:flex;align-items:center;justify-content:space-between;gap:8px}.catalog-paging button{border:1px solid #ddd;border-radius:8px;padding:6px 10px;background:white} </style></head><body><main><div class="brand">Seoul Beauty</div><small>Beauty is personal. Let's talk.</small><h1>이거 진짜<br>나만 없어? 💄</h1><p>너도 이 제품 갖고 있어? 하나만 골라봐.</p><label for="catalog-search">어떤 제품이 궁금해?</label><input class="catalog-search" id="catalog-search" type="search" placeholder="제품·브랜드 검색"><select id="catalog-brand" aria-label="브랜드"><option value="all">전체 브랜드</option></select><div id="catalog-list" class="catalog-list"></div><div class="catalog-paging"><button id="catalog-prev" type="button">← 이전</button><small id="catalog-count"></small><button id="catalog-next" type="button">다음 →</button></div><section class="product"><img id="image" alt="제품 이미지" src="/beauty-play/assets/p-64960.jpg"><div><small id="brand">Fwee</small><strong id="name">3D Voluming Gloss</strong><small>다른 사람은 뭐라고 했을까?</small></div></section><div class="choices" id="choices"></div><p class="notice" id="notice" aria-live="polite"></p><section id="followup" class="hide"><h2 id="follow-title" style="font-size:21px"></h2><div id="follow-choices" class="choices"></div><button id="skip-follow" type="button" style="border:0;background:none;color:#777;padding:15px 0">건너뛰고 결과 보기 →</button></section><section class="note-box hide" id="note-box"><label for="note">한마디 남길래? (선택)</label><textarea id="note" maxlength="160" placeholder="써봤다면 어떤 점이 기억나? 안 써봤다면 궁금한 점도 좋아."></textarea><small>안 써도 돼. 지금은 다른 사람에게 공개되지 않아.</small><button id="save-note" type="button">한마디 저장</button></section><section class="results hide" id="results"><h2 style="font-size:19px">다른 사람들의 선택</h2><small id="total"></small><div id="bars"></div></section><div class="foot">한 제품에 하나의 응답 · 다시 선택하면 변경돼요. 익명 투표입니다.</div></main>
<script>
const labels={owned:'지금 갖고 있어',past:'전에 써봤어',want:'없는데 갖고 싶어',unknown:'처음 봐'};
const followups={owned:{title:'얼마나 자주 써?',options:{daily:'거의 매일',weekly:'일주일에 몇 번',sometimes:'가끔',rarely:'거의 안 써'}},past:{title:'다시 사고 싶어?',options:{rebuy_yes:'응, 또 살래',rebuy_unsure:'글쎄, 고민 중',rebuy_no:'아니, 안 살래'}},want:{title:'왜 갖고 싶어?',options:{looks:'색이나 디자인이 예뻐서',social:'SNS에서 많이 봐서',recommended:'추천받아서',replacement:'지금 쓰는 제품이 아쉬워서'}},unknown:{title:'이 제품이 궁금해졌어?',options:{curious:'응, 궁금해!',not_sure:'아직 잘 모르겠어'}}};
let products=[],p=null,catalogPage=0,generation=0,busy=false;const PAGE_SIZE=10;
const params=new URLSearchParams(location.search),search=document.getElementById('catalog-search'),listing=document.getElementById('catalog-list');
function selectProduct(next){if(busy)return;const requestGeneration=++generation;p=next;document.getElementById('brand').textContent=p.brand;document.getElementById('name').textContent=p.name;document.getElementById('image').src=p.image;document.getElementById('results').classList.add('hide');document.getElementById('followup').classList.add('hide');document.getElementById('note-box').classList.add('hide');current=null;skip=false;notice.textContent='';const url=new URL(location.href);url.searchParams.set('product',p.id);history.replaceState(null,'',url.pathname+url.search);document.getElementById('note').value='';document.querySelectorAll('[data-choice]').forEach(b=>b.setAttribute('aria-pressed','false'));request().then(v=>{if(requestGeneration!==generation)return;skip=Boolean(v.mine&&!v.mineFollowup);render(v)}).catch(()=>{if(requestGeneration!==generation)return;notice.textContent='출시 준비 중인 기능입니다.';});}
function listCatalog(){const q=search.value.trim().toLowerCase();const selectedBrand=document.getElementById('catalog-brand').value;const filtered=products.filter(x=>(selectedBrand==='all'||x.brand===selectedBrand)&&(x.brand+' '+x.name).toLowerCase().includes(q)).sort((a,b)=>a.brand.localeCompare(b.brand));const pages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));catalogPage=Math.min(catalogPage,pages-1);listing.replaceChildren();for(const item of filtered.slice(catalogPage*PAGE_SIZE,(catalogPage+1)*PAGE_SIZE)){const button=document.createElement('button'),img=document.createElement('img'),label=document.createElement('span');img.src=item.image;img.alt='';label.textContent=item.brand+' · '+item.name;button.append(img,label);button.onclick=()=>{selectProduct(item);listing.hidden=true;};listing.append(button);}listing.hidden=false;document.getElementById('catalog-count').textContent=filtered.length+'개 · '+(catalogPage+1)+'/'+pages;document.getElementById('catalog-prev').disabled=catalogPage===0;document.getElementById('catalog-next').disabled=catalogPage>=pages-1;}
document.getElementById('catalog-brand').onchange=()=>{catalogPage=0;listCatalog()};
search.oninput=()=>{catalogPage=0;listCatalog()};search.onfocus=()=>{listing.hidden=false;listCatalog()};document.getElementById('catalog-prev').onclick=()=>{catalogPage--;listing.hidden=false;listCatalog()};document.getElementById('catalog-next').onclick=()=>{catalogPage++;listing.hidden=false;listCatalog()};
const choices=document.getElementById('choices'),notice=document.getElementById('notice');let current=null,skip=false;
for(const [id,label] of Object.entries(labels)){const b=document.createElement('button');b.textContent=label;b.dataset.choice=id;b.setAttribute('aria-pressed','false');choices.append(b);b.addEventListener('click',()=>vote(id));}
function render(v){current=v;document.querySelectorAll('[data-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.choice===v.mine)));
const completed=!!v.mine&&(v.mineFollowup||skip);
document.getElementById('followup').classList.toggle('hide',!v.mine||completed);
document.getElementById('results').classList.toggle('hide',!completed);
document.getElementById('note-box').classList.toggle('hide',!v.mine||!completed);
if(v.mine&&!completed){const config=followups[v.mine],box=document.getElementById('follow-choices');document.getElementById('follow-title').textContent=config.title;box.replaceChildren();for(const [id,label] of Object.entries(config.options)){const b=document.createElement('button');b.textContent=label;b.onclick=()=>submit(v.mine,id);box.append(b);}}
if(!completed)return;
document.getElementById('total').textContent=v.total+'개의 응답';const bars=document.getElementById('bars');bars.replaceChildren();
const source=v.mine&&v.mineFollowup?(v.followupCounts?.[v.mine]||{}):v.counts;
const entries=v.mine&&v.mineFollowup?Object.entries(followups[v.mine].options):Object.entries(labels);
const total=Object.values(source).reduce((a,b)=>a+(Number(b)||0),0);
for(const [id,label] of entries){const count=source[id]||0,pct=total?Math.round(100*count/total):0;const node=document.createElement('div');node.className='result';const line=document.createElement('div');line.className='line';const title=document.createElement('span');title.textContent=label;const countLabel=document.createElement('span');countLabel.textContent=count+'명'+(total>=5?' · '+pct+'%':'');line.append(title,countLabel);const track=document.createElement('div');track.className='track';const fill=document.createElement('div');fill.className='fill';fill.style.width=pct+'%';track.append(fill);node.append(line,track);bars.append(node);}
}
async function request(choice,followup,note){const url='/api/owned-poll?product='+encodeURIComponent(p.id)+(params.get('test')==='1'?'&test=1':'');const body=choice?{choice,option:params.get('product')===p.id?params.get('option'):null,...(followup!==undefined?{followup}:{}) ,...(note!==undefined?{note}:{})}:null;const r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{method:'GET'});const data=await r.json();if(!r.ok)throw Error(data.error||'서버 연결 실패');return data;}
async function submit(choice,followup,note){if(busy||!p)return;busy=true;generation++;document.querySelectorAll('button,input,select').forEach(b=>b.disabled=true);notice.textContent='선택을 저장하고 있어요…';try{const v=await request(choice,followup,note);render(v);notice.textContent='선택이 반영됐어!';}catch(e){notice.textContent='저장하지 못했어. 다시 시도해줘.';}finally{busy=false;document.querySelectorAll('button,input,select').forEach(b=>b.disabled=false);listCatalog();}}
function vote(choice){skip=false;return submit(choice,null);}
document.getElementById('skip-follow').onclick=()=>{skip=true;render(current)};
document.getElementById('save-note').onclick=()=>{if(!current?.mine)return;submit(current.mine,current.mineFollowup,document.getElementById('note').value.trim());};
if(params.get('test')==='1')document.querySelector('.foot').textContent+=' 테스트 모드 · 실제 참여 집계와 분리돼요.';
fetch('/owned-poll/catalog.json').then(r=>{if(!r.ok)throw Error('catalog');return r.json()}).then(items=>{products=items;const brandSelect=document.getElementById('catalog-brand');for(const brand of [...new Set(items.map(x=>x.brand))].sort()){const option=document.createElement('option');option.value=brand;option.textContent=brand;brandSelect.append(option);}p=products.find(x=>x.id===params.get('product'))||products[0];selectProduct(p);listCatalog()}).catch(()=>{notice.textContent='제품 목록을 불러오지 못했어요.'});
</script></body></html>
