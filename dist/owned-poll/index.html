<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>너도 갖고 있어? · Seoul Beauty</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fa;color:#1b1b1b;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}main{max-width:440px;min-height:100dvh;margin:auto;background:#fff;padding:22px}.brand{font-size:20px;font-weight:750}small,.hint{color:#777}h1{font-size:30px;line-height:1.3;margin:34px 0 10px;letter-spacing:-1px}p{margin:8px 0 18px}.product{border-radius:18px;background:#f7f7fa;padding:18px;display:flex;align-items:center;gap:15px;margin:22px 0}.product img{width:92px;height:100px;object-fit:contain;background:white;border-radius:12px}.product strong{display:block;font-size:16px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choices button{font:inherit;border-radius:12px;border:1px solid #ddd;background:white;min-height:68px;padding:12px;cursor:pointer;font-weight:600}.choices button[aria-pressed=true]{border:2px solid #0679ee;background:#eef6ff}button:disabled{opacity:.5}.results{margin:25px 0}.result{margin:14px 0}.line{display:flex;justify-content:space-between}.track{height:9px;background:#f2f2f2;border-radius:10px;overflow:hidden}.fill{height:100%;background:#0786ff;transition:width .3s}.foot{margin-top:34px;font-size:12px;color:#777}.notice{font-size:13px;min-height:25px;color:#555}.hide{display:none}
</style></head><body><main><div class="brand">Seoul Beauty</div><small>Beauty is personal. Let's talk.</small><h1>이거 진짜<br>나만 없어? 💄</h1><p>너도 이 제품 갖고 있어? 하나만 골라봐.</p><section class="product"><img id="image" alt="제품 이미지" src="/beauty-play/assets/p-64960.jpg"><div><small id="brand">Fwee</small><strong id="name">3D Voluming Gloss</strong><small>다른 사람은 뭐라고 했을까?</small></div></section><div class="choices" id="choices"></div><p class="notice" id="notice" aria-live="polite"></p><section class="results hide" id="results"><h2 style="font-size:19px">다른 사람들의 선택</h2><small id="total"></small><div id="bars"></div></section><div class="foot">한 제품에 하나의 응답 · 다시 선택하면 변경돼요. 익명 투표이며 테스트 화면은 실제 서비스와 분리돼 있습니다.</div></main>
<script>
const labels={owned:'나도 있어! 💗',want:'갖고 싶어 👀',disliked:'써봤는데 별로',unknown:'처음 봐'};const products=[{id:'64960',brand:'Fwee',name:'3D Voluming Gloss'},{id:'100982',brand:'Fwee',name:'Rose Obsession Lip Tint'},{id:'111432',brand:'LAKA',name:'Perfect Twin Lip'}];const params=new URLSearchParams(location.search);const p=products.find(p=>p.id===params.get('product'))||products[0];document.getElementById('brand').textContent=p.brand;document.getElementById('name').textContent=p.name;document.getElementById('image').src='/beauty-play/assets/p-'+p.id+'.jpg';const choices=document.getElementById('choices'),notice=document.getElementById('notice');for(const [id,label] of Object.entries(labels)){const b=document.createElement('button');b.textContent=label;b.dataset.choice=id;b.setAttribute('aria-pressed','false');choices.append(b);b.addEventListener('click',()=>vote(id));}
function show(v){document.querySelectorAll('[data-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.choice===v.mine)));const results=document.getElementById('results'),bars=document.getElementById('bars');results.classList.remove('hide');document.getElementById('total').textContent=v.total+'개의 응답';bars.replaceChildren();for(const [id,label] of Object.entries(labels)){const count=v.counts[id]||0,pct=v.total?Math.round(100*count/v.total):0;const node=document.createElement('div');node.className='result';const line=document.createElement('div');line.className='line';const name=document.createElement('span');name.textContent=label;const num=document.createElement('span');num.textContent=pct+'% ('+count+')';line.append(name,num);const track=document.createElement('div');track.className='track';const fill=document.createElement('div');fill.className='fill';fill.style.width=pct+'%';track.append(fill);node.append(line,track);bars.append(node);}}
async function request(choice){const r=await fetch('/api/owned-poll?product='+encodeURIComponent(p.id),choice?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({choice})}:{method:'GET'});const data=await r.json();if(!r.ok)throw Error(data.error||'서버 연결 실패');return data;}
async function vote(choice){document.querySelectorAll('[data-choice]').forEach(b=>b.disabled=true);notice.textContent='선택을 저장하고 있어요…';try{show(await request(choice));notice.textContent='선택이 반영됐어요.';}catch(e){notice.textContent='아직 사용할 수 없어요. '+e.message;}finally{document.querySelectorAll('[data-choice]').forEach(b=>b.disabled=false);}}
request().then(show).catch(()=>{notice.textContent='출시 준비 중인 기능입니다.'});
</script></body></html>
