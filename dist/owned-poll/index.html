<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seoul Beauty</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fa;color:#1b1b1b;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}main{max-width:440px;min-height:100dvh;margin:auto;background:#fff;padding:22px}.brand{font-size:20px;font-weight:750}small,.hint{color:#777}h1{font-size:30px;line-height:1.3;margin:34px 0 10px;letter-spacing:-1px}p{margin:8px 0 18px}.product{border-radius:18px;background:#f7f7fa;padding:18px;display:flex;align-items:center;gap:15px;margin:22px 0}.product img{width:92px;height:100px;object-fit:contain;background:white;border-radius:12px}.product strong{display:block;font-size:16px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choices button{font:inherit;border-radius:12px;border:1px solid #ddd;background:white;min-height:68px;padding:12px;cursor:pointer;font-weight:600}.choices button[aria-pressed=true]{border:2px solid #0679ee;background:#eef6ff}button:disabled{opacity:.5}.results{margin:25px 0}.result{margin:14px 0}.line{display:flex;justify-content:space-between}.track{height:9px;background:#f2f2f2;border-radius:10px;overflow:hidden}.fill{height:100%;background:#0786ff;transition:width .3s}.foot{margin-top:34px;font-size:12px;color:#777}.notice{font-size:13px;min-height:25px;color:#555}.hide{display:none}.note-box{margin-top:18px;border-top:1px solid #eee;padding-top:16px}.note-box label{display:block;font-weight:650;margin-bottom:8px}.note-box textarea{width:100%;min-height:82px;border:1px solid #ddd;border-radius:12px;padding:12px;font:inherit;resize:vertical}.note-box button{width:100%;background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px;font:inherit;margin-top:8px}.note-box small{display:block;margin-top:6px}
 .catalog-search{width:100%;font:inherit;padding:12px;border:1px solid #ddd;border-radius:11px}.catalog-list{display:grid;gap:5px;max-height:220px;overflow:auto;margin:8px 0}.catalog-list button{display:flex;gap:8px;align-items:center;text-align:left;width:100%;border:1px solid #e9e9e9;border-radius:8px;padding:8px;background:#fff;font:inherit}.catalog-list img{width:38px;height:43px;object-fit:contain} .catalog-paging{display:flex;align-items:center;justify-content:space-between;gap:8px}.catalog-paging button{border:1px solid #ddd;border-radius:8px;padding:6px 10px;background:white} .catalog-controls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.catalog-controls select{font:inherit;max-width:100%;padding:8px;border:1px solid #ddd;border-radius:8px;background:white}.language{float:right}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #0679ee;outline-offset:2px}.image-fallback{width:92px;min-height:100px;display:grid;place-items:center;color:#777;font-size:12px}#retry{padding:8px}.hide{display:none!important}</style></head><body><main><a class="language" id="language"></a><div class="brand">Seoul Beauty</div><small>Beauty is personal. Let's talk.</small><h1 data-copy="title"></h1><p data-copy="intro"></p><label for="catalog-search" data-copy="find"></label><input class="catalog-search" id="catalog-search" type="search"><div class="catalog-controls"><select id="catalog-source"><option value="game" data-copy="game"></option><option value="catalog" data-copy="catalog"></option></select><select id="catalog-market" aria-label="Market"><option value="KR">Korea</option><option value="US">United States</option></select><select id="catalog-brand"></select></div><small id="catalog-hint" data-copy="catalogHint" class="hide"></small><div id="catalog-list" class="catalog-list"></div><div class="catalog-paging"><button id="catalog-prev" type="button" data-copy="previous"></button><small id="catalog-count" aria-live="polite
