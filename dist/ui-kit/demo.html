<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SeoulBeauty UI Kit</title><link rel="stylesheet" href="./seoulbeauty-ui.css"><style>body{background:#f2f5f9;margin:0}.sbui{max-width:420px;min-height:100dvh;margin:auto}.inner{padding:16px}.section{margin-top:22px}</style></head><body><main class="sbui"><div class="sbui-chat-header"><div aria-label="뒤로가기">←</div><div style="text-align:center"><div class="sbui-chat-title">쿠션 색상 고민방</div><div class="sbui-chat-subtitle">메이크업 · 컬러 선택</div></div><span>···</span></div><div class="inner"><div class="sbui-badge">UI Kit · 독립 데모</div><div class="sbui-message"><div class="sbui-author">Glow22 · 가상 예시</div>21호랑 23호 중 어떤 게 더 자연스러울까요?<div class="sbui-caption">질문과 대화는 가상 데이터입니다.</div></div><div class="sbui-poll-card"><span class="sbui-badge">대화 중 투표</span><div class="sbui-poll-title">어떤 립 컬러가 더 잘 어울릴까요?</div><div class="sbui-poll-options"><button class="sbui-poll-option" aria-pressed="false" data-vote="rose"><span class="sbui-poll-swatch sbui-poll-swatch--rose"></span><span class="sbui-poll-option-label">A · 로즈 핑크</span></button><button class="sbui-poll-option" aria-pressed="false" data-vote="coral"><span class="sbui-poll-swatch sbui-poll-swatch--coral"></span><span class="sbui-poll-option-label">B · 피치 코랄</span></button></div><p class="sbui-option-note">투표는 선택 사항이며 이 데모에서만 표시됩니다.</p><button class="sbui-btn sbui-btn--secondary" id="abstain">기권 / 선택 취소</button><div class="sbui-result" id="result" aria-live="polite">실제 투표 수 없음 · 테스트 화면</div></div><div class="sbui-message"><div class="sbui-author">RoseLove · 가상 예시</div>전 로즈 핑크가 좋아요. 다만 어떤 메이크업을 하는지에 따라 다를 것 같아요.<div class="sbui-caption">답장하기 · 선택적 경험 공유</div></div><div class="section"><div class="sbui-badge">공통 버튼</div><div style="display:flex;gap:8px;margin-top:10px"><button class="sbui-btn">보내기</button><button class="sbui-btn sbui-btn--secondary">건너뛰기</button><button class="sbui-btn sbui-btn--icon" aria-label="첨부">＋</button></div></div></div><div class="sbui-composer"><button class="sbui-btn sbui-btn--icon" aria-label="추가">＋</button><textarea rows="1" placeholder="자유롭게 이야기하세요…" aria-label="메시지"></textarea><button class="sbui-btn" id="send">전송</button></div><div class="inner sbui-caption" id="msg"></div></main><script>const opts=[...document.querySelectorAll('[data-vote]')],result=document.getElementById('result');for(const b of opts)b.addEventListener('click',()=>{for(const x of opts)x.setAttribute('aria-pressed',String(x===b));result.textContent='내 선택: '+(b.dataset.vote==='rose'?'로즈 핑크':'피치 코랄')+' · 실제 투표 집계 없음';});document.getElementById('abstain').onclick=()=>{opts.forEach(x=>x.setAttribute('aria-pressed','false'));result.textContent='기권 · 실제 투표 집계 없음';};document.getElementById('send').onclick=()=>{const t=document.querySelector('textarea');document.getElementById('msg').textContent=t.value?'내 로컬 메시지: '+t.value:'메시지를 입력하세요.';t.value='';};</script></body></html>
