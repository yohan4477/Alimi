<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>립 컬러 고민방 · 서울뷰티 UI 라이브러리</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#171717;font:15px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:2px solid #0786ff;outline-offset:2px}
.phone{width:100%;max-width:480px;margin:auto;min-height:690px;background:white;display:flex;flex-direction:column}
.head{height:73px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #eee;padding:10px 12px}.icon{border:none;background:white;font-size:25px;min-width:32px}.heading{flex:1;text-align:center}.heading strong{font-size:18px;letter-spacing:-.3px}.heading small{display:block;color:#757575;margin-top:6px;font-size:12px}
.thread{flex:1;padding:18px 12px 6px}.message{display:flex;align-items:start;gap:9px;margin-bottom:14px}.avatar{width:31px;height:31px;border-radius:50%;background:#f1f1f1;display:flex;align-items:center;justify-content:center;flex-shrink:0}.avatar svg{width:19px;height:19px}.msgbody{min-width:0;flex:1}.username{font-weight:650;margin:2px 0 6px}.bubble{background:#f3f3f3;border-radius:16px;padding:13px;font-size:15px;line-height:1.5}.time{color:#777;font-size:12px;margin:7px 0 0}.reply{border:0;background:none;color:#6e6e6e;padding:6px 0;font-size:12px}
.poll{border:1px solid #e0e0e0;border-radius:17px;padding:13px 12px 12px;margin:8px 0 15px}.pollhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.badge{font-size:12px;border-radius:7px;background:#eee;padding:5px 8px}.muted{font-size:12px;color:#777}.poll h2{font-size:17px;margin:15px 0 13px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.opt{border:1px solid #ddd;border-radius:12px;background:white;padding:8px;text-align:left;min-width:0}.opt[aria-pressed=true]{border:2px solid #0786ff;padding:7px}.swatch{height:96px;border-radius:8px;margin-bottom:10px}.rose{background:#b77c93}.coral{background:#eca69a}.opt b{display:block;font-size:14px}.opt small{display:block;color:#777;margin:8px 0 2px;font-size:12px}.pollnote{font-size:12px;color:#757575;margin:12px 0 0}.selection{display:none;background:#f6f7f9;border-radius:10px;padding:12px;margin-top:12px}.selection.open{display:block}.selection label{display:block;font-size:12px;margin:10px 0 7px}.selection textarea{width:100%;min-height:66px;border:1px solid #ddd;border-radius:9px;padding:9px}.primary{width:100%;padding:10px;background:#0786ff;border:0;border-radius:9px;color:white;margin-top:8px}
.composer{display:flex;align-items:center;gap:9px;padding:9px 12px 15px}.add,.send{height:36px;width:36px;flex-shrink:0;border-radius:50%;display:grid;place-items:center}.add{border:1px solid #d9d9d9;background:#fff;font-size:25px;line-height:1}.send{border:0;background:#f1f1f1;color:#858585;font-size:20px}.composer textarea{border:1px solid #dedede;border-radius:10px;padding:10px 12px;height:39px;min-height:39px;resize:vertical;flex:1;min-width:0;max-height:100px}.menu{display:none;border:1px solid #ddd;padding:9px;border-radius:10px;margin:0 12px}.menu.open{display:block}.menu button{display:block;border:0;background:#fff;padding:8px}
.bottom{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #eee;padding:12px 0 14px}.bottom span{display:flex;flex-direction:column;align-items:center;gap:6px;color:#656565;font-size:11px}.bottom .active{color:#1b6dbc}.bottom svg{width:21px;height:21px}.newmsg{margin:10px 0 10px 40px}.disclaimer{font-size:10px;color:#999;text-align:center;padding:5px}
</style></head><body><div class="phone">
<header class="head"><button class="icon" aria-label="뒤로가기">‹</button><div class="heading"><strong>립 컬러 고민방</strong><small>메이크업 · 컬러 선택</small></div><button class="icon" aria-label="더보기">···</button></header>
<main class="thread">
<div class="message"><div class="avatar" aria-hidden="true">♙</div><div class="msgbody"><div class="username">PeachGirl</div><div class="bubble">쿨톤인데 데일리 립을 고민하고 있어요. 둘 중 어떤 컬러가 좋을까요?</div><div class="time">오후 2:10</div></div></div>
<section class="poll"><div class="pollhead"><span class="badge">Beauty Pick · 투표</span><span class="muted">예시 · 미집계</span></div><h2>어떤 립 컬러를 추천하세요?</h2><div class="options"><button id="rose" class="opt" aria-pressed="false"><div class="swatch rose"></div><b>A · 로즈 핑크</b><small>선택</small></button><button id="coral" class="opt" aria-pressed="false"><div class="swatch coral"></div><b>B · 피치 코랄</b><small>선택</small></button></div><p class="pollnote">투표하지 않아도 대화에 참여할 수 있어요.</p><div class="selection" id="selection"><b id="choiceLabel"></b><p class="muted">실제 투표 수·비율은 연결되지 않았어.</p><label for="why">왜 선택했나요? (선택)</label><textarea id="why" placeholder="선택한 이유 또는 사용 경험을 남겨주세요."></textarea><button class="primary" id="complete">선택 완료</button></div></section>
<div class="message"><div class="avatar" aria-hidden="true">♙</div><div class="msgbody"><div class="username">RoseLove</div><div class="bubble">전 로즈 추천해요! 피치 코랄은 생각보다 오렌지색이 강하게 올라오더라고요.</div><button id="reply" class="reply">↪ 답장하기</button></div></div><div id="messages"></div>
</main><div id="menu" class="menu"><button id="experience">내 사용 경험 공유</button><button id="product">제품 첨부</button></div>
<div class="composer"><button id="add" class="add" aria-label="추가">+</button><textarea id="draft" aria-label="메시지 입력" rows="1" placeholder="자유롭게 이야기하세요..."></textarea><button id="send" class="send" aria-label="전송">➤</button></div>
<nav class="bottom"><span class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="14" height="12" rx="2"/><path d="M9 16v4l5-4M18 9h3v10h-5"/></svg>커뮤니티</span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg>탐색</span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/><path d="M4 22v-2a8 8 0 0 1 16 0v2"/></svg>내 활동</span></nav></div><div class="disclaimer">가상 데이터 · UI 라이브러리 시안 · 서버 저장 없음</div>
<script>
let choice=null;const el=x=>document.getElementById(x);function vote(id){choice=id;['rose','coral'].forEach(x=>el(x).setAttribute('aria-pressed',String(x===id)));el('choiceLabel').textContent='내 선택: '+(id==='rose'?'로즈 핑크':'피치 코랄');el('selection').classList.add('open')}
el('rose').onclick=()=>vote('rose');el('coral').onclick=()=>vote('coral');function message(t,label='나'){if(!t.trim())return;const m=document.createElement('div');m.className='newmsg';const a=document.createElement('div');a.className='username';a.textContent=label;const b=document.createElement('div');b.className='bubble';b.textContent=t;m.append(a,b);el('messages').append(m)}
el('complete').onclick=()=>{message((choice==='rose'?'로즈 핑크':'피치 코랄')+' 선택'+(el('why').value.trim()?' — '+el('why').value.trim():''),'나 · 투표 의견');el('selection').classList.remove('open')};el('reply').onclick=()=>{el('draft').value='@RoseLove 혹시 직접 사용해 보셨나요?';el('draft').focus()};el('add').onclick=()=>el('menu').classList.toggle('open');el('experience').onclick=()=>{el('draft').value='제가 사용해 본 경험은 ';el('menu').classList.remove('open');el('draft').focus()};el('product').onclick=()=>{el('draft').value='이 제품이 궁금해요: ';el('menu').classList.remove('open');el('draft').focus()};el('send').onclick=()=>{message(el('draft').value);el('draft').value=''};
</script></body></html>
