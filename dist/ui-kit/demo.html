<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>립 컬러 고민방 · SeoulBeauty UI</title><style>
:root{--ink:#242424;--muted:#90959f;--blue:#0786ff;--line:#e9edf1;--soft:#f5f6f8}*{box-sizing:border-box}body{font:14px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;margin:0;background:white;color:var(--ink)}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.shell{min-height:100dvh;display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid var(--line)}.icon{border:0;background:none;font-size:21px;min-width:29px}.title{flex:1;text-align:center;font-weight:700;font-size:16px}.sub{font-size:11px;color:var(--muted);font-weight:400;margin-top:4px}.main{flex:1;padding:18px 15px 12px;overflow:auto}.msg{display:flex;gap:9px;margin:0 0 16px}.avatar{background:#f1f3f6;border-radius:100%;height:32px;width:32px;display:grid;place-items:center;color:#69798a;flex-shrink:0}.msgbody{flex:1;min-width:0}.author{font-size:12px;font-weight:650;margin:2px 0 7px}.bubble{background:#f4f5f7;border-radius:14px;padding:12px 13px;line-height:1.55}.time,.reply{font-size:11px;color:var(--muted);margin-top:7px}.reply{border:0;background:none;padding:0}.poll{border:1px solid #e5e8ec;border-radius:15px;padding:15px;margin:11px 0 17px}.pollhead{display:flex;justify-content:space-between;align-items:center;gap:4px}.badge{background:#f2f4f8;border-radius:6px;padding:5px 8px;font-size:11px;font-weight:600}.poll h2{font-size:15px;margin:15px 0 12px}.options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opt{background:white;border:1px solid #e5e8ec;border-radius:12px;padding:9px;text-align:left;min-width:0}.opt[aria-pressed=true]{border:2px solid var(--blue);padding:8px}.swatch{height:84px;border-radius:8px;margin-bottom:9px}.rose{background:#bf7890}.coral{background:#eca392}.opt span{font-size:12px;font-weight:650}.check{float:right;color:var(--blue)}.hint{font-size:11px;color:var(--muted);margin:12px 0 0}.selected{background:#f5f7fa;border-radius:10px;padding:12px;margin-top:12px}.input{border:1px solid #e4e8ef;border-radius:10px;width:100%;padding:10px;min-height:58px;resize:vertical}.btn{background:var(--blue);color:white;border:0;border-radius:10px;padding:11px 14px;margin-top:9px;width:100%}.composer{display:flex;gap:9px;align-items:end;padding:12px 15px;border-top:1px solid var(--line)}.composer textarea{min-height:44px;max-height:110px;flex:1;resize:vertical}.round{height:42px;width:42px;flex-shrink:0;background:#fff;border:1px solid #e0e3e7;border-radius:10px;font-size:22px}.send{height:42px;width:42px;border:none;border-radius:10px;background:var(--blue);color:#fff}.menu{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}.menu button{display:block;padding:9px;border:0;background:none}.nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding:10px 0 13px;text-align:center;font-size:11px;color:var(--muted)}.nav .active{color:#0786ff;font-weight:700}.demo{font-size:10px;color:#92969b;text-align:center;padding:6px}
</style></head><body><div class="shell"><header class="top"><button class="icon" aria-label="뒤로가기">‹</button><div class="title">립 컬러 고민방<div class="sub">메이크업 · 컬러 선택</div></div><button class="icon" aria-label="더보기">···</button></header><main class="main"><div class="msg"><div class="avatar">♙</div><div class="msgbody"><div class="author">PeachGirl</div><div class="bubble">쿨톤인데 데일리 립을 고민하고 있어요. 둘 중 어떤 컬러가 좋을까요?</div><div class="time">오후 2:10</div></div></div>
<section class="poll"><div class="pollhead"><span class="badge">Beauty Pick · 투표</span><span class="time">예시 · 미집계</span></div><h2>어떤 립 컬러를 추천하세요?</h2><div class="options"><button class="opt" id="rose" aria-pressed="false"><div class="swatch rose"></div><span>A · 로즈 핑크</span><span class="check" hidden>✓</span></button><button class="opt" id="coral" aria-pressed="false"><div class="swatch coral"></div><span>B · 피치 코랄</span><span class="check" hidden>✓</span></button></div><div class="hint" id="hint">투표하지 않아도 대화할 수 있어요.</div><div class="selected" id="detail" hidden><div id="chosen"></div><p class="hint">실제 투표 수·비율은 연결되지 않았어.</p><label for="reason" style="display:block;margin:12px 0 7px;font-size:12px">왜 선택했나요? (선택)</label><textarea class="input" id="reason" placeholder="선택한 이유 또는 사용 경험을 알려주세요."></textarea><button class="btn" id="finish">선택 완료</button></div></section>
<div class="msg"><div class="avatar">♙</div><div class="msgbody"><div class="author">RoseLove</div><div class="bubble">전 로즈 추천해요! 피치 코랄은 생각보다 오렌지색이 강하게 올라오더라고요.</div><button class="reply" id="reply">↩ 답장하기</button></div></div><div id="messages"></div><div class="menu" id="menu" hidden><button id="exp">내 사용 경험 공유</button><button id="attach">제품 첨부</button></div></main><div class="composer"><button id="add" class="round" aria-label="추가">＋</button><textarea id="text" class="input" rows="1" placeholder="자유롭게 이야기하세요…"></textarea><button id="send" class="send" aria-label="전송">➤</button></div><nav class="nav"><div class="active">⌂<div>커뮤니티</div></div><div>⌕<div>탐색</div></div><div>♙<div>내 활동</div></div></nav><div class="demo">가상 데이터 기반 UI 라이브러리 시안 · 서버 전송 없음</div></div><script>
let choice='';const g=id=>document.getElementById(id);function choose(id){choice=id;['rose','coral'].forEach(x=>{const b=g(x);b.setAttribute('aria-pressed',String(x===id));b.querySelector('.check').hidden=x!==id});g('detail').hidden=false;g('hint').hidden=true;g('chosen').textContent='내 선택: '+(id==='rose'?'로즈 핑크':'피치 코랄')}
g('rose').onclick=()=>choose('rose');g('coral').onclick=()=>choose('coral');function add(text,kind){if(!text.trim())return;const m=document.createElement('div');m.className='msg';const body=document.createElement('div');body.className='msgbody';body.style.marginLeft='40px';const a=document.createElement('div');a.className='author';a.textContent='나'+(kind?' · '+kind:'');const b=document.createElement('div');b.className='bubble';b.textContent=text;body.append(a,b);m.append(body);g('messages').append(m);}
g('finish').onclick=()=>{add((choice==='rose'?'로즈 핑크':'피치 코랄')+' 선택'+(g('reason').value.trim()?' · '+g('reason').value.trim():''),'투표 의견');g('detail').hidden=true;g('hint').hidden=false;g('hint').textContent='내 선택이 이 미리보기에만 반영됐어요.'};g('reply').onclick=()=>{g('text').value='@RoseLove 혹시 직접 사용해 보셨나요?';g('text').focus()};g('add').onclick=()=>g('menu').hidden=!g('menu').hidden;g('exp').onclick=()=>{g('text').value='제가 사용해 본 경험은 ';g('menu').hidden=true;g('text').focus()};g('attach').onclick=()=>{g('text').value='이 제품에 대해 궁금해요: ';g('menu').hidden=true;g('text').focus()};g('send').onclick=()=>{add(g('text').value,'메시지');g('text').value=''};
</script></body></html>
