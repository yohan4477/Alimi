<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="description" content="서울뷰티에서 같은 뷰티 고민을 가진 사람들과 이야기해요."><meta property="og:title" content="SeoulBeauty | 뷰티 이야기 초대"><meta property="og:description" content="화장품 고민부터 사용 후기까지, 서울뷰티에서 편하게 이야기해요."><meta property="og:type" content="website"><title>서울뷰티 초대 | SeoulBeauty</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#252525;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}main{min-height:100svh;display:flex;flex-direction:column;max-width:440px;margin:auto;padding:27px 24px max(32px,env(safe-area-inset-bottom))}.logo{display:inline-flex;align-items:center;text-decoration:none}.logo img{display:block;width:min(100%,320px);height:auto;object-fit:contain}header{width:100%;text-align:center}.logo{width:100%;justify-content:center}.spacer{flex:1;min-height:65px}.eyebrow{font-size:13px;font-weight:700;color:#818181}h1{font-size:34px;line-height:1.32;letter-spacing:-1.5px;margin:17px 0 16px}p{font-size:16px;color:#707070;line-height:1.8;margin:0}.preview{background:#fafafa;border:1px solid #ededed;border-radius:20px;padding:22px 20px;margin:40px 0 22px}.line{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:650}.dot{height:8px;width:8px;background:#83a795;border-radius:50%;flex-shrink:0}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.chip{font-size:13px;padding:9px 12px;border:1px solid #ededed;border-radius:100px;background:white;color:#555}.bottom{margin-top:auto}a.cta{display:block;text-align:center;border-radius:13px;padding:17px 16px;background:#252525;color:white;text-decoration:none;font-size:16px;font-weight:700}.choose{margin-top:16px}.choose-title{font-size:13px;font-weight:700;color:#333;margin:0 0 10px}.choices{display:flex;gap:8px;flex-wrap:wrap}.choice{border:1px solid #e8e8e8;background:white;color:#444;border-radius:100px;padding:10px 13px;min-height:43px;font:inherit;font-size:13px;cursor:pointer}.choice[aria-pressed=true]{background:#eff6ff;border-color:#7da5ca;color:#20517f;font-weight:700}.choice:focus-visible{outline:3px solid #7da5ca;outline-offset:2px}.insight{border-top:1px solid #e9e9e9;margin-top:16px;padding-top:13px;font-size:13px;color:#626262;line-height:1.6;min-height:35px}.sub{text-align:center;font-size:12px;color:#8a8a8a;margin-top:15px}a:focus-visible{outline:3px solid #7da5ca;outline-offset:3px}</style></head>
<body><main><header><a class="logo" href="/kr" aria-label="Seoul Beauty 홈"><img src="/seoul-beauty-logo.svg" alt="Seoul Beauty — Beauty Lives Together" width="320" height="121"></a></header><div class="spacer"></div><section><div class="eyebrow">서울뷰티에 초대받았어요</div><h1>뷰티 고민,<br>같이 이야기해요.</h1><p>어떤 제품이 나에게 맞을지 고민될 때,<br>직접 써본 사람들의 이야기를 들어보세요.</p><div class="preview"><div class="line"><span class="dot"></span>이런 이야기를 나눠요</div><div class="chips"><span class="chip">#스킨케어</span><span class="chip">#메이크업</span><span class="chip">#제품 추천</span><span class="chip">#솔직한 사용 후기</span></div><div class="choose"><p class="choose-title">어떤 이야기가 가장 궁금해요?</p><div class="choices" role="group" aria-label="관심 있는 뷰티 이야기"><button type="button" class="choice" data-interest="trouble" aria-pressed="false">트러블·피부 고민</button><button type="button" class="choice" data-interest="experience" aria-pressed="false">써본 사람의 후기</button><button type="button" class="choice" data-interest="compare" aria-pressed="false">제품 비교</button><button type="button" class="choice" data-interest="makeup" aria-pressed="false">메이크업 추천</button></div><p class="insight" id="interest-message" role="status">선택하지 않아도 바로 둘러볼 수 있어요.</p></div></div></section><div class="bottom"><a class="cta" id="join" href="/kr">대화방 둘러보기 →</a><div class="sub">가입 없이 먼저 둘러볼 수 있어요</div></div></main><script>const q=new URLSearchParams(location.search);const room=q.get('room');if(room && /^[a-zA-Z0-9_-]{1,100}$/.test(room)){const u=new URL('/kr',location.origin);u.searchParams.set('room',room);document.getElementById('join').href=u.pathname+u.search;document.getElementById('join').textContent='초대받은 대화방 보기 →'}const messages={trouble:'비슷한 피부 고민을 가진 사람들의 이야기를 찾아보세요.',experience:'직접 사용한 사람들이 남긴 경험과 질문을 살펴보세요.',compare:'어떤 점이 다른지 실제 사용 경험을 비교해 보세요.',makeup:'내 취향에 맞는 메이크업 이야기를 찾아보세요.'};document.querySelectorAll('[data-interest]').forEach(button=>button.addEventListener('click',()=>{const selected=button.getAttribute('aria-pressed')==='true';document.querySelectorAll('[data-interest]').forEach(item=>item.setAttribute('aria-pressed','false'));button.setAttribute('aria-pressed',String(!selected));document.getElementById('interest-message').textContent=selected?'선택하지 않아도 바로 둘러볼 수 있어요.':messages[button.dataset.interest];}));</script></body></html>
