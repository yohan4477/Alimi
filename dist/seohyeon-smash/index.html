<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>서현역 부수기</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>
<div id="popups"></div>

<div id="hud" class="hidden">
  <div class="row">
    <div class="box score"><span class="lab">부순 집값</span><b id="hScore">0원</b></div>
    <div class="box"><span class="lab">메테오</span><b id="hMeteor">20</b></div>
    <div class="box"><span class="lab">시간</span><b id="hTime">60</b></div>
    <button id="mute" class="box btn" aria-label="소리">소리 켬</button>
  </div>
  <div class="row small">
    <div class="pill">붕괴 <b id="hDest">0</b>채</div>
    <div class="pill">파괴율 <b id="hPct">0.00</b>%</div>
    <div class="pill lv">Lv.<b id="hLv">1</b> · 반경 <b id="hRad">24</b>m</div>
  </div>
</div>
<div id="banner"></div>

<div id="start" class="overlay">
  <div class="card">
    <div class="kicker">분당 서현역 반경 1km 미니어처</div>
    <h1>서현역 부수기</h1>
    <p class="how">지도 아무 곳이나 <b>탭</b>하면 메테오가 떨어집니다.<br>드래그로 이동 · 두 손가락/휠로 확대<br>60초, 메테오 20개로 <b>집값</b>을 최대한 날리세요!</p>
    <p class="best" id="bestStart"></p>
    <button id="go" class="big" disabled>불러오는 중…</button>
    <p class="note">실제 건물 이름·층수 데이터 기반 · 사람은 등장하지 않습니다</p>
  </div>
</div>

<div id="end" class="overlay hidden">
  <div class="card">
    <div class="kicker">게임 끝!</div>
    <div class="sub">부순 집값 총</div><h1 id="eScore">0원</h1>
    <ul class="stats">
      <li>붕괴한 건물 <b id="eDest">0</b>채</li>
      <li>도시 파괴율 <b id="ePct">0</b>%</li>
      <li>최고 콤보 <b id="eCombo">0</b>채</li>
      <li>가장 큰 건물 <b id="eBig">-</b></li>
    </ul>
    <p class="best" id="eBest"></p>
    <div class="btns">
      <button id="again" class="big">다시</button>
      <button id="share" class="big ghost">결과 복사</button>
    </div>
    <p class="note" id="shareMsg"></p>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
