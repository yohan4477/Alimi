name: Alimi
options:
  bundleIdPrefix: com.alimi
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  Alimi:
    type: application
    platform: iOS
    sources:
      - path: Alimi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alimi.prototype
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Alimi
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Alimi/Alimi.entitlements
        ALIMI_SUPABASE_URL: ''
        ALIMI_SUPABASE_PUBLISHABLE_KEY: ''
        INFOPLIST_KEY_ALIMISupabaseURL: $(ALIMI_SUPABASE_URL)
        INFOPLIST_KEY_ALIMISupabasePublishableKey: $(ALIMI_SUPABASE_PUBLISHABLE_KEY)
        INFOPLIST_KEY_ALIMIAPNSEnvironment: $(ALIMI_APNS_ENVIRONMENT)
      configs:
        Debug:
          ALIMI_APNS_ENVIRONMENT: sandbox
          ALIMI_APNS_ENTITLEMENT: development
        Release:
          ALIMI_APNS_ENVIRONMENT: production
          ALIMI_APNS_ENTITLEMENT: production
  AlimiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AlimiTests
    dependencies:
      - target: Alimi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Alimi:
    build:
      targets:
        Alimi: all
    test:
      targets:
        - AlimiTests

