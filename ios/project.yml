name: Alimi
options:
  bundleIdPrefix: com.yohan4477
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  Alimi:
    type: application
    platform: iOS
    sources:
      - path: Alimi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yohan4477.seoulbeauty
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Seoul Beauty
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        CODE_SIGN_STYLE: Automatic
  AlimiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AlimiTests
    dependencies:
      - target: Alimi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  AlimiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AlimiUITests
    dependencies:
      - target: Alimi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Alimi
schemes:
  Alimi:
    build:
      targets:
        Alimi: all
    test:
      targets:
        - AlimiTests
        - AlimiUITests
