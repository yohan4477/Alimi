name: Alimi
options:
  bundleIdPrefix: com.alimi
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  Alimi:
    type: application
    platform: iOS
    sources:
      - path: Alimi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alimi.prototype
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Alimi
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
  AlimiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AlimiTests
    dependencies:
      - target: Alimi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Alimi:
    build:
      targets:
        Alimi: all
    test:
      targets:
        - AlimiTests
