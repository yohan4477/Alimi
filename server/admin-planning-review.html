const groups={community:['community','chat','product','brand'],search:['search','brand','product','attach','chat'],activity:['activity']};let tab='community',view='community',selected=0,marks=true;

root.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;view=groups[tab][0];selected=0;}else if(b.dataset.view){view=b.dataset.view;selected=0;}else if(b.dataset.change!==undefined){selected=Number(b.dataset.change);}else if(b.id==='sb-marker-toggle'){marks=!marks;b.setAttribute('aria-pressed',String(marks));b.textContent=marks?'변경 위치 표시':'기존 화면만 보기';}else return;render();});render();
