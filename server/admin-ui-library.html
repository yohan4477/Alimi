<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seoul Beauty · UI Library v1</title><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.55 Arial,'Apple SD Gothic Neo',sans-serif;color:#30272d;background:#f0eeee}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #b46e8c;outline-offset:3px}.shell{max-width:1260px;margin:auto;padding:30px 24px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}.top h1{font-size:26px;letter-spacing:-1px;font-weight:500;margin:0}.top p{margin:5px 0;color:#776b72;font-size:13px}.toolbar{display:flex;gap:6px}.toolbar button,.screen-nav button{border:1px solid #d7ccd1;background:#fff;padding:10px 14px;border-radius:9px;color:#58444e}.toolbar button.active,.screen-nav button.active{background:#86435d;color:#fff;border-color:#86435d}.screen-nav{display:flex;flex-wrap:wrap;gap:7px;margin:24px 0}.screen-nav button{font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 22px}.screen-title{font-size:14px;font-weight:500;margin:0 0 10px}.screen-note{font-size:12px;color:#786d73;margin:10px 3px 0}.phone{background:#fcfaf7;border:1px solid #dfd5da;border-radius:24px;overflow:hidden;box-shadow:0 7px 20px #3a223108;padding:23px;min-width:0;min-height:580px}.phone header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.logo{font:24px Georgia,serif;letter-spacing:-1px}.phone small{font-size:12px;color:#86717b}.phone .tag{font-size:11px;background:#eee3e8;border-radius:14px;padding:4px 8px;color:#795265}.phone h2{font-size:27px;line-height:1.3;letter-spacing:-1px;font-weight:500;margin:12px 0 18px}.phone h3{font-size:18px;font-weight:500;margin:8px 0}.phone p{margin:9px 0}.phone button{display:block;width:100%;border:1px solid #dfcfd7;color:#58404b;background:#fff;border-radius:11px;text-align:left;padding:12px 14px;min-height:46px;margin:8px 0}.phone button.primary,.phone button.selected{background:#86435d;color:#fff;border-color:#86435d}.phone button.quiet{border:0;background:none;color:#86717b;text-align:center}.phone button:disabled{opacity:.4;cursor:default}.phone input[type=text],.phone input[type=search],.phone textarea{width:100%;border:1px solid #dfcfd7;border-radius:10px;padding:12px;background:#fff;color:#30272d}.phone textarea{min-height:70px;resize:vertical}.phone label{display:block;font-size:13px;margin:12px 0 5px}.placeholder{height:65px;min-width:65px;border-radius:12px;background:#f0e8ec;display:flex;align-items:center;justify-content:center;color:#997e8b;font-size:11px}.product{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #ece1e6}.product div:last-child{min-width:0}.product strong{display:block;font-size:14px;font-weight:500}.product button{width:auto;margin-left:auto;min-width:44px;padding:8px;text-align:center}.box{border-radius:14px;padding:17px;background:#f2e7ed;margin:18px 0}.box p{margin:0}.step{display:flex;gap:4px;margin:10px 0 20px}.step i{height:4px;background:#e5d8df;flex:1;border-radius:5px}.step i.on{background:#86435d}.drop{background:#f4edef;border:1px dashed #bfa5b2;border-radius:16px;padding:27px 16px;text-align:center;margin:18px 0}.drop img{display:block;max-height:240px;width:100%;object-fit:contain;border-radius:10px}.pill{font-size:11px;color:#80566a;background:#eee0e7;border-radius:20px;padding:4px 8px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.split strong{font-weight:500;display:block}.row{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-top:14px}.bar{height:6px;background:#e8dce2;border-radius:5px;margin:6px 0}.bar i{display:block;height:100%;background:#a6798c;border-radius:5px}.single{max-width:410px;margin:auto}.single .phone{min-height:560px}.toast{font-size:13px;color:#80566a;text-align:center;min-height:20px}.footer{font-size:12px;color:#82737b;margin:25px 0}.demo-note{font-size:12px;color:#88707d;margin-top:16px}.flow{animation:enter .2s ease-out}@keyframes enter{from{transform:translateX(18px);opacity:.4}to{transform:translateX(0);opacity:1}}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:660px){.shell{padding:20px 12px}.grid{grid-template-columns:1fr;max-width:410px;margin:auto}.phone{min-height:0;padding:22px}.top h1{font-size:23px}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}
@media(max-width:600px){.shell{padding:16px 0}.top,.screen-nav,.footer,#beauty-pick-title,#beauty-pick-title~p{padding-left:12px;padding-right:12px}}
</style></head><body><div class="shell"><section aria-labelledby="beauty-pick-title" style="margin-bottom:32px"><h2 id="beauty-pick-title" style="margin:0">기존 시안 · Chat + Beauty Pick</h2><p>로즈 핑크 / 피치 코랄 A·B 비교 → 선택 이유 → 자유 채팅. 기존 시안 그대로 보존 · 색상 견본 예시 · 서버 저장 없음.</p><p><a href="/api/admin?view=beauty-pick" target="_blank" rel="noopener">비교 UI 크게 열기 ↗</a></p><div style="width:100%;max-width:480px;margin:16px auto 0"><iframe title="기존 Beauty Pick A/B 비교 UI" src="/api/admin?view=beauty-pick" style="border:0;width:100%;height:900px;display:block"></iframe></div></section><div class="top"><div><h1>Seoul Beauty · UI Library</h1><p>취향 카드 → 최애 맞히기 · 화면 설계 v1</p></div><div class="toolbar"><button data-mode="gallery" class="active">전체 화면</button><button data-mode="flow">순서대로 체험</button></div></div><nav class="screen-nav" aria-label="화면 목록"></nav><main id="main"></main><p class="toast" id="toast" role="status"></p><p class="footer">검토용 프로토타입 · 실제 공유·서버 저장 없음 · 사진은 이 화면에서만 처리 · 집계는 예시 · 제품 사진은 확보 전 자리 표시</p></div>
<script>
(()=>{const titles=['시작','제품 선택','사진 업로드','비밀 답 설정','내 카드','공유 미리보기','친구 투표','정답 공개','내 모음'];const notes=['나를 표현할 제품 모음 만들기','검색·직접 입력. 3~5개 선택','내 사진 + 번호로 후보 구분','정답과 선택적 한 줄 이유','공유 전 완성된 결과물','공개 범위 확인 후 친구에게 질문','친구는 가입 없이 한 번 선택','예상과 실제 경험의 차이','다시 보고 수정할 기록'];let mode='gallery',current=0,selected=[0,1,2],favorite=0,guess=null,reason='수정화장할 때 이것만 쓰게 돼.',photo=null,photoMode=false,query='';const catalog=[{brand:'rom&nd',name:'쥬시 래스팅 틴트'},{brand:'Torriden',name:'다이브인 세럼'},{brand:'LANEIGE',name:'립 슬리핑 마스크'},{brand:'직접 입력',name:'내 제품'}];const main=document.getElementById('main'),nav=document.querySelector('.screen-nav');const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(text,act,primary=false,disabled=false)=>`<button data-act="${act}" class="${primary?'primary':''}" ${disabled?'disabled':''}>${text}</button>`;const selectedProducts=()=>selected.map(i=>catalog[i]);function rows(selectable=false,subset=selected){return subset.map(i=>`<div class="product"><div class="placeholder">사진 준비 중</div><div><small>${esc(catalog[i].brand)}</small><strong>${esc(catalog[i].name)}</strong></div>${selectable?`<button data-toggle="${i}" class="${selected.includes(i)?'selected':''}" aria-label="${esc(catalog[i].name)} ${selected.includes(i)?'제거':'추가'}">${selected.includes(i)?'✓':'+'}</button>`:''}</div>`).join('');}const progress=n=>`<div class="step">${[0,1,2].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>`;function candidates(action){return photoMode?[0,1,2].map(i=>`<button data-${action}="${i}" class="${(action==='fav'?favorite:guess)===i?'selected':''}">사진 속 ${i+1}번 제품</button>`).join(''):selected.map((id,i)=>`<button data-${action}="${i}" class="${(action==='fav'?favorite:guess)===i?'selected':''}">${esc(catalog[id].brand)} · ${esc(catalog[id].name)}</button>`).join('');}const name=i=>photoMode?`사진 속 ${i+1}번 제품`:selectedProducts()[i]?.name||'제품을 선택해 주세요';function content(n){switch(n){case 0:return `<small>내 취향을 보여주는 작은 모음</small><h2>내 파우치만 보고<br>최애를 맞혀봐.</h2><p>요즘 쓰는 뷰티 아이템 3~5개.<br>친구는 내 취향을 얼마나 알까?</p><div class="box"><small>만들기 → 친구의 선택 → 정답 공개</small></div>${btn('제품 골라서 만들기 →','select',true)}${btn('내 사진으로 만들기','upload')}<small>가입 없이 먼저 만들어 봐.</small>`;case 1:return `${progress(0)}<h2>나를 보여주는<br>아이템을 골라봐.</h2><input type="search" data-search placeholder="브랜드 또는 제품 검색" value="${esc(query)}" aria-label="제품 검색"><div data-results>${rows(true,catalog.map((_,i)=>i).filter(i=>(catalog[i].brand+catalog[i].name).toLowerCase().includes(query.toLowerCase())))}</div><p><small>${selected.length} / 5개 선택</small></p><input type="text" data-custom placeholder="없으면 브랜드·제품명 직접 입력" aria-label="직접 입력 제품명">${btn('직접 입력한 제품 추가','add')}${btn('이 제품들로 만들기 →','setup',true,selected.length<3)}`;case 2:return `${progress(0)}<h2>내 파우치를<br>한 장에 담아봐.</h2><div class="drop">${photo?`<img src="${photo}" alt="내가 올린 제품 사진">`:'<p>제품이 잘 보이는 사진 한 장</p><small>사진 위에 1·2·3번이 보이도록 준비해 줘.</small>'}<label>사진 선택<input type="file" accept="image/*" data-photo></label></div><small>첫 시안은 번호를 표시한 사진으로 체험해요.<br>사진 위 번호 배치는 후속 화면에서 구현 예정.</small>${btn('이 사진으로 계속 →','photo-setup',true,!photo)}`;case 3:return `${progress(1)}<h2>이 중 가장<br>자주 쓰는 건?</h2><small>친구에게는 아직 비밀이야.</small>${candidates('fav')}<label>왜 이 제품이야? <small>선택</small></label><textarea data-reason aria-label="최애 제품을 선택한 이유" maxlength="200">${esc(reason)}</textarea>${btn('내 카드 완성하기 →','card',true,(!photoMode&&selected.length<3))}`;case 4:return `<span class="pill">내 취향 카드</span><h2>내 파우치에서<br>가장 손이 가는 건?</h2>${photoMode&&photo?`<div class="drop"><img src="${photo}" alt="내 제품 모음"></div>`:rows()}<div class="box"><small>나만 보는 정답</small><h3>${esc(name(favorite))}</h3></div>${btn('친구에게 물어보기 ↗','share',true)}${btn('제품·정답 수정하기','setup')}`;case 5:return `<small>공유 미리보기</small><h2>친구에게<br>이렇게 물어볼까?</h2><div class="box"><p>내 파우치에서 가장 자주 쓰는 건 뭘까?<br>하나 골라봐. 정답은 누르면 공개!</p></div><p><small>링크를 받은 사람은 제품 모음과, 투표 후 내 정답·이유를 볼 수 있어요.</small></p>${btn('공유받은 친구 화면 체험 →','friend',true)}<small>이 파일에서는 메시지를 실제로 보내지 않아요.</small>${btn('← 내 카드로','card')}`;case 6:return `<small>친구가 보낸 질문</small><h2>이 중 가장<br>자주 쓰는 건 뭘까?</h2>${photoMode&&photo?`<div class="drop"><img src="${photo}" alt="친구의 제품 모음"></div>`:''}${candidates('guess')}<small>하나 고르면 친구의 정답이 공개돼.</small>`;case 7:{const actualGuess=guess??(favorite===0?1:0);return `<small>${guess===null?'결과 화면 예시':'친구의 정답 공개'}</small><h2>${actualGuess===favorite?'맞혔어!<br>내 취향 좀 아네.':'의외지?<br>내 선택은 이거야.'}</h2><div class="box"><small>가장 자주 쓰는 제품</small><h3>${esc(name(favorite))}</h3>${reason?`<p>“${esc(reason)}”</p>`:''}</div><small>네가 고른 제품 · ${esc(name(actualGuess))}</small><div class="row"><span>이 제품을 고른 사람</span><span>예시 6 / 10명</span></div><div class="bar"><i style="width:60%"></i></div>${btn('나도 이거 써!','same')}${btn('내 파우치도 만들어 보기 →','new',true)}${btn('내 모음 보기','collection')}`;}case 8:return `<small>내 활동</small><h2>나를 보여주는<br>작은 모음들.</h2><div class="box"><small>방금 만든 카드</small><h3>내 파우치 최애 맞히기</h3><p>${photoMode?'사진 한 장':selected.length+'개 제품'} · 정답 ${esc(name(favorite))}</p></div>${btn('내 카드 다시 보기','card',true)}${btn('새 모음 만들기','new')}<small>이 시안의 기록은 파일을 닫으면 초기화돼요.</small>`;}}
function draw(){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));nav.innerHTML=titles.map((t,i)=>`<button data-screen="${i}" class="${mode==='flow'&&current===i?'active':''}">${String(i+1).padStart(2,'0')} ${t}</button>`).join('');main.className=mode==='gallery'?'grid':'single';main.innerHTML=(mode==='gallery'?titles.map((_,i)=>i):[current]).map(i=>`<article><h3 class="screen-title">${String(i+1).padStart(2,'0')} · ${titles[i]}</h3><div class="phone ${mode==='flow'?'flow':''}" data-context="${i}"><header><div><div class="logo">Seoul Beauty</div><small>Beauty is personal. Let’s talk.</small></div><span class="tag">시안</span></header>${content(i)}</div><p class="screen-note">${notes[i]}</p></article>`).join('');}
function go(n){current=n;mode='flow';draw();}function toast(t){document.getElementById('toast').textContent=t;}
document.addEventListener('input',e=>{if(e.target.matches('[data-reason]'))reason=e.target.value;if(e.target.matches('[data-search]')){query=e.target.value;e.target.closest('.phone').querySelector('[data-results]').innerHTML=rows(true,catalog.map((_,i)=>i).filter(i=>(catalog[i].brand+catalog[i].name).toLowerCase().includes(query.toLowerCase())));}});
document.addEventListener('change',e=>{if(e.target.matches('[data-photo]')){const file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')||file.size>10*1024*1024){toast('10MB 이하의 이미지 파일을 선택해 주세요.');return;}const reader=new FileReader();reader.onload=()=>{photo=reader.result;photoMode=true;go(2);};reader.readAsDataURL(file);}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.mode){mode=b.dataset.mode;draw();return;}if(b.dataset.screen!==undefined){go(Number(b.dataset.screen));return;}if(b.dataset.toggle!==undefined){const id=Number(b.dataset.toggle);if(selected.includes(id))selected=selected.filter(i=>i!==id);else if(selected.length<5)selected.push(id);else{toast('최대 5개까지 고를 수 있어요.');return;}favorite=0;photoMode=false;go(1);return;}if(b.dataset.fav!==undefined){favorite=Number(b.dataset.fav);go(3);return;}if(b.dataset.guess!==undefined){guess=Number(b.dataset.guess);go(7);return;}switch(b.dataset.act){case'select':photoMode=false;go(1);break;case'upload':go(2);break;case'photo-setup':photoMode=true;favorite=0;go(3);break;case'setup':go(3);break;case'card':go(4);break;case'share':go(5);break;case'friend':guess=null;go(6);break;case'collection':go(8);break;case'new':guess=null;photoMode=false;selected=[];favorite=0;reason='';go(0);break;case'same':b.textContent='✓ 나도 쓴다고 공감했어요';toast('체험용 반응이에요. 실제로 전달되지는 않아요.');break;case'add':{const input=b.closest('.phone').querySelector('[data-custom]'),value=input.value.trim();if(!value){toast('브랜드와 제품명을 입력해 주세요.');return;}if(selected.length>=5){toast('제품 하나를 빼면 추가할 수 있어요.');return;}catalog.push({brand:'직접 입력',name:value.slice(0,100)});selected.push(catalog.length-1);photoMode=false;query='';go(1);break;}}});draw();})();
</script></body></html>
