<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>효과 도감</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#17181b;--muted:#6b6e76;--line:#e3e1dc;--accent:#2d5bff;--use:#14804a;--skip:#b42318;--hold:#a15c00;--chip:#efede8}
@media (prefers-color-scheme:dark){:root{--bg:#121316;--card:#1b1d21;--ink:#ecedef;--muted:#9a9ea7;--line:#2c2f35;--accent:#7c9bff;--use:#4cc38a;--skip:#ff7a6e;--hold:#f0b45a;--chip:#25282d}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--muted);margin:0 0 12px;font-size:13.5px}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.stat b{font-size:15px}
.roles{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}
.roles button,.fbtn{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13.5px;cursor:pointer;white-space:nowrap}
.roles button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.roles button small{opacity:.65;margin-left:3px}
.filters{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:0 0 6px}
.filters label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font-size:13px;cursor:pointer}
.filters select{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 8px}
.filters .lead{font-size:12.5px;color:var(--muted)}
.count{color:var(--muted);font-size:13px;margin:6px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card[data-pick=use]{border-color:var(--use);box-shadow:inset 0 0 0 1px var(--use)}
.card[data-pick=skip]{opacity:.62}
.card[data-pick=hold]{border-color:var(--hold)}
.head h2{font-size:16px;margin:0;line-height:1.35}
.head code{font-size:11.5px;color:var(--muted);word-break:break-all}
.vids{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vbox{min-width:0}
.vbox .lab{font-size:11.5px;color:var(--muted);margin:0 0 3px;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.vframe{position:relative;aspect-ratio:9/16;background:#000;border-radius:8px;overflow:hidden}
.vframe video{width:100%;height:100%;object-fit:contain;display:block}
.vframe .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:12px;text-align:center;padding:8px}
.pending{aspect-ratio:9/16;border:1.5px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;padding:10px}
.alt{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.alt button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:6px;font-size:11px;padding:2px 6px;cursor:pointer}
.alt button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.score{font-weight:700;color:var(--use)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{background:var(--chip);border-radius:6px;padding:2px 7px;font-size:11.5px}
.tag.role{background:var(--ink);color:var(--bg)}
.tag.warn{background:transparent;border:1px solid var(--skip);color:var(--skip)}
.tag.ok{background:transparent;border:1px solid var(--use);color:var(--use)}
.tag.mid{background:transparent;border:1px solid var(--hold);color:var(--hold)}
.tag.zoom{background:var(--accent);color:#fff}
.tag.prio{background:transparent;border:1px solid var(--accent);color:var(--accent)}
dl.uses{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:13px}
dl.uses dt{color:var(--muted);white-space:nowrap}
dl.uses dd{margin:0}
details{font-size:12.5px;color:var(--muted)}
details summary{cursor:pointer}
details ul{margin:4px 0 0;padding-left:18px}
details a{color:var(--accent)}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:auto}
.picks button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 0;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.picks button[data-v=use][aria-pressed=true]{background:var(--use);border-color:var(--use);color:#fff}
.picks button[data-v=skip][aria-pressed=true]{background:var(--skip);border-color:var(--skip);color:#fff}
.picks button[data-v=hold][aria-pressed=true]{background:var(--hold);border-color:var(--hold);color:#fff}
.picks button:disabled{opacity:.5}
.status{font-size:12px;color:var(--muted);min-height:16px}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
#toast.on{opacity:1}
.empty{padding:30px;text-align:center;color:var(--muted)}
</style></head>

  <div class="grid" id="grid"></div>
</main>

function $(id){ return document.getElementById(id); }
var toastT;
function toast(msg){ var t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove("on"); }, 2200); }
var PRIO = {}; (D.stage2_top15 || []).forEach(function(id, i){ PRIO[id] = i + 1; });
var PICK_LABEL = {use: "쓸 것", skip: "안 쓸 것", hold: "보류"};

/* ---------- 영상: 화면에 들어올 때만 서명 URL → Blob → object URL (아이폰 사파리) ---------- */
var blobCache = {};
function viaBlob(name){
  return blobCache[name] || (blobCache[name] = fetch(MEDIA + encodeURIComponent(name), {credentials: "same-origin"})
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(j){ return fetch(j.url); })
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.blob(); })
    .then(function(b){ if (b.size < 1000 || /html|json|text/.test(b.type)) throw new Error("not video"); return URL.createObjectURL(new Blob([b], {type: "video/mp4"})); })
    .catch(function(e){ delete blobCache[name]; throw e; }));
}
function setVideo(frame, name){
  var v = frame.querySelector("video"), msg = frame.querySelector(".msg");
  frame.dataset.want = name; v.removeAttribute("src"); msg.textContent = "불러오는 중…"; msg.hidden = false;
  if (frame.dataset.visible !== "1") { msg.textContent = ""; return; }
  viaBlob(name).then(function(u){ if (frame.dataset.want !== name) return; v.src = u; msg.hidden = true; var p = v.play(); if (p && p.catch) p.catch(function(){}); })
    .catch(function(){ if (frame.dataset.want === name) msg.textContent = "영상을 불러오지 못했어요. 다시 스크롤하면 재시도"; });
}
var io = "IntersectionObserver" in window ? new IntersectionObserver(function(entries){
  entries.forEach(function(en){
    var f = en.target, v = f.querySelector("video");
    if (en.isIntersecting) { f.dataset.visible = "1"; if (!v.getAttribute("src")) setVideo(f, f.dataset.want); else { var p = v.play(); if (p && p.catch) p.catch(function(){}); } }
    else { f.dataset.visible = "0"; v.pause(); }
  });
}, {rootMargin: "200px 0px"}) : null;
function frameHTML(name){ return '<div class="vframe" data-want="' + esc(name) + '"><video muted loop playsinline preload="none"></video><div class="msg"></div></div>'; }

/* ---------- 카드 ---------- */
function levelTag(l){ return l === "가능" ? "ok" : l === "조건부" ? "mid" : "warn"; }
function cardHTML(e){
  var refs = e.clips.refs, ours = e.clips.ours || [];
  var alt = function(list, kind){ return list.length > 1 ? '<div class="alt" data-kind="' + kind + '">' + list.map(function(c, i){ return '<button type="button" data-i="' + i + '" aria-pressed="' + (i === 0) + '">' + (i + 1) + '</button>'; }).join("") + '</div>' : ""; };
  var ref0 = refs[0], our0 = ours[0];
  var oursBox = our0
    ? '<p class="lab" data-lab="ours">' + esc(our0.label) + (our0.score ? ' <span class="score">' + esc(our0.score) + '</span>' : "") + '</p>' + frameHTML(our0.media) + alt(ours, "ours")
    : '<p class="lab">우리 재현</p><div class="pending">제작 예정<br>(2단계)</div>';
  var ks = e.korean_subtitle_ok;
  var tags = ['<span class="tag role">' + esc(e.role) + '</span>',
    '<span class="tag">화려함 ' + "★".repeat(e.intensity) + "☆".repeat(3 - e.intensity) + '</span>',
    e.zoom_or_transition ? '<span class="tag zoom">줌·전환</span>' : "",
    e.icon_explain ? '<span class="tag">아이콘 설명</span>' : "",
    '<span class="tag ' + levelTag(ks.level) + '">한국어 자막 ' + esc(ks.level) + '</span>',
    e.needs_cutout ? '<span class="tag warn">누끼 필요</span>' : "",
    e.face_safe ? "" : '<span class="tag warn">얼굴 가림 주의</span>',
    '<span class="tag">' + esc(e.formats.join("·")) + '</span>',
    e.use_in.map(function(u){ return '<span class="tag">' + esc(u) + '</span>'; }).join(""),
    e.kind === "advised" ? '<span class="tag mid">편집 요령</span>' : "",
    PRIO[e.id] ? '<span class="tag prio">2단계 우선 ' + PRIO[e.id] + '위</span>' : ""].join("");
  var srcs = e.sources.map(function(s){ return '<li><a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">' + esc(s.channel) + '</a> · ' + esc(s.platform) + ' · ' + esc(s.date) + ' · ' + esc(s.title) + (s.at ? ' · ' + esc(s.at) : "") + '</li>'; }).join("");
  var merged = e.merged_from.length ? '<li>합친 효과: ' + esc(e.merged_from.join(", ")) + '</li>' : "";
  var oursNotes = ours.map(function(o){ return '<li>' + esc(o.label) + (o.score ? " " + esc(o.score) : "") + " — " + esc(o.note) + '</li>'; }).join("");
  return '<article class="card" id="fx-' + esc(e.id) + '" data-id="' + esc(e.id) + '">' +
    '<div class="head"><h2>' + esc(e.name_ko) + '</h2><code>' + esc(e.id) + '</code></div>' +
    '<div class="vids"><div class="vbox" data-kind="refs"><p class="lab" data-lab="refs">' + esc(ref0.label) + '</p>' + frameHTML(ref0.media) + alt(refs, "refs") + '</div><div class="vbox" data-kind="ours">' + oursBox + '</div></div>' +
    '<div class="tags">' + tags + '</div>' +
    '<dl class="uses"><dt>맞는 말</dt><dd>' + esc(e.fits.join(" · ")) + '</dd><dt>언제 쓰나</dt><dd>' + esc(e.when) + '</dd><dt>쓰지 말 때</dt><dd>' + esc(e.avoid_when) + '</dd>' +
    (ks.note ? '<dt>자막 조건</dt><dd>' + esc(ks.note) + '</dd>' : "") + (e.note ? '<dt>메모</dt><dd>' + esc(e.note) + '</dd>' : "") + '</dl>' +
    '<details><summary>출처 ' + e.sources.length + '곳' + (merged ? ' · 합친 효과' : "") + '</summary><ul>' + srcs + merged + oursNotes + '</ul></details>' +
    '<div class="picks" role="group" aria-label="' + esc(e.name_ko) + ' 선택">' + ["use", "skip", "hold"].map(function(v){ return '<button type="button" data-v="' + v + '" aria-pressed="false">' + PICK_LABEL[v] + '</button>'; }).join("") + '</div>' +
    '<p class="status" data-status></p></article>';
}
var byId = {};
D.effects.forEach(function(e){ byId[e.id] = e; });
$("grid").innerHTML = D.effects.map(cardHTML).join("");
var cards = [].slice.call(document.querySelectorAll(".card"));
cards.forEach(function(c){ c.querySelectorAll(".vframe").forEach(function(f){ if (io) io.observe(f); else { f.dataset.visible = "1"; setVideo(f, f.dataset.want); } }); });

/* 원본·재현 여러 개 전환 */
document.addEventListener("click", function(ev){
  var b = ev.target.closest(".alt button"); if (!b) return;
  var box = b.closest(".vbox"), kind = box.dataset.kind, e = byId[box.closest(".card").dataset.id];
  var list = kind === "refs" ? e.clips.refs : e.clips.ours, c = list[+b.dataset.i];
  box.querySelectorAll(".alt button").forEach(function(x){ x.setAttribute("aria-pressed", String(x === b)); });
  box.querySelector(".lab").innerHTML = esc(c.label) + (c.score ? ' <span class="score">' + esc(c.score) + '</span>' : "");
  setVideo(box.querySelector(".vframe"), c.media);
});

/* ---------- 역할 탭·필터 ---------- */
D.fits.forEach(function(f){ var o = document.createElement("option"); o.value = f; o.textContent = f; $("f-fit").appendChild(o); });
function roleButtons(){
  var n = {}; D.effects.forEach(function(e){ n[e.role] = (n[e.role] || 0) + 1; });
  $("roles").innerHTML = ['<button type="button" data-role="" aria-pressed="' + (state.role === "") + '">전체<small>' + D.effects.length + '</small></button>']
    .concat(D.roles.map(function(r){ return '<button type="button" data-role="' + esc(r) + '" aria-pressed="' + (state.role === r) + '">' + esc(r) + '<small>' + (n[r] || 0) + '</small></button>'; })).join("");
}
roleButtons();
$("roles").addEventListener("click", function(ev){ var b = ev.target.closest("button"); if (!b) return; state.role = b.dataset.role; save(); roleButtons(); apply(); });
var boxes = {nocut: "f-nocut", ko: "f-ko", mid: "f-mid", zoom: "f-zoom", icon: "f-icon", ours: "f-ours", unchecked: "f-unchecked"};
Object.keys(boxes).forEach(function(k){ var el = $(boxes[k]); el.checked = !!state[k]; el.addEventListener("change", function(){ state[k] = el.checked; save(); apply(); }); });
$("f-fit").value = state.fit; $("f-fmt").value = state.fmt;
$("f-fit").addEventListener("change", function(){ state.fit = this.value; save(); apply(); });
$("f-fmt").addEventListener("change", function(){ state.fmt = this.value; save(); apply(); });
function match(e){
  if (state.role && e.role !== state.role) return false;
  if (state.fit && e.fits.indexOf(state.fit) < 0) return false;
  if (state.fmt && e.formats.indexOf(state.fmt) < 0) return false;
  if (state.nocut && e.needs_cutout) return false;
  if (state.ko && e.korean_subtitle_ok.level === "어려움") return false;
  if (state.mid && e.use_in.indexOf("롱폼 중간 해설") < 0 && e.use_in.indexOf("롱폼 어디나") < 0) return false;
  if (state.zoom && !e.zoom_or_transition) return false;
  if (state.icon && !e.icon_explain) return false;
  if (state.ours && !e.clips.ours) return false;
  if (state.unchecked && picks[e.id]) return false;
  return true;
}
function apply(){
  var shown = 0;
  cards.forEach(function(c){ var ok = match(byId[c.dataset.id]); c.hidden = !ok; if (ok) shown++; });
  $("count").textContent = shown + "개 보임 / 전체 " + D.effects.length + "개";
  var g = $("grid"), empty = g.querySelector(".empty");
  if (!shown && !empty) g.insertAdjacentHTML("beforeend", '<p class="empty">조건에 맞는 효과가 없습니다.</p>'); else if (shown && empty) empty.remove();
  stats();
}
function stats(){
  var s = D.summary, n = {use: 0, skip: 0, hold: 0};
  Object.keys(picks).forEach(function(id){ var v = picks[id] && picks[id].v; if (n[v] != null && byId[id]) n[v]++; });
  var done = n.use + n.skip + n.hold;
  $("stats").innerHTML = '<span class="stat">효과 <b>' + s.total + '</b></span><span class="stat">우리 재현 있음 <b>' + s.ours + '</b> · 제작 예정 <b>' + s.pending + '</b></span>' +
    '<span class="stat">체크 <b>' + done + '</b>/' + s.total + (picksLoaded ? '' : ' (불러오는 중)') + '</span><span class="stat">쓸 것 <b>' + n.use + '</b> · 안 쓸 것 <b>' + n.skip + '</b> · 보류 <b>' + n.hold + '</b></span>';
}

/* ---------- 체크 저장 ---------- */
function paint(id){
  var c = $("fx-" + id); if (!c) return; var v = picks[id] && picks[id].v;
  if (v) c.dataset.pick = v; else delete c.dataset.pick;
  c.querySelectorAll(".picks button").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.v === v)); });
}
function loadPicks(){
  fetch(PICKS, {credentials: "same-origin", cache: "no-store"}).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(j){ picks = (j && j.picks) || {}; picksLoaded = true; Object.keys(byId).forEach(paint); apply(); })
    .catch(function(){ picksLoaded = true; stats(); toast("저장된 체크를 불러오지 못했어요. 새로고침해 주세요."); });
}
document.addEventListener("click", function(ev){
  var b = ev.target.closest(".picks button"); if (!b) return;
  var card = b.closest(".card"), id = card.dataset.id, cur = picks[id] && picks[id].v;
  var value = cur === b.dataset.v ? "clear" : b.dataset.v;
  var st = card.querySelector("[data-status]"), btns = card.querySelectorAll(".picks button");
  btns.forEach(function(x){ x.disabled = true; }); st.textContent = "저장 중…";
  fetch(PICKS, {method: "POST", credentials: "same-origin", headers: {"Content-Type": "application/json"}, body: JSON.stringify({id: id, value: value})})
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(j){ picks = (j && j.picks) || picks; Object.keys(byId).forEach(paint); st.textContent = value === "clear" ? "체크를 지웠어요" : "저장됨 · " + PICK_LABEL[value]; apply(); })
    .catch(function(err){ st.textContent = "저장 실패 (" + err.message + ") — 다시 눌러 주세요"; })
    .then(function(){ btns.forEach(function(x){ x.disabled = false; }); });
});
apply(); loadPicks();
})();
</script>
</body></html>
