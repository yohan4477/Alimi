<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alimi · K-beauty price alerts</title><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="stylesheet" href="style.css"></head><body><div id="browse"><header><a class="logo" href="./">Alimi</a><div class="searchbar"><input id="search" data-i18n-attr="aria-label:search.label;placeholder:search.placeholder"><button id="clear" data-i18n-attr="aria-label:search.clear">×</button></div><button data-view="saved" class="header-save" data-i18n-attr="aria-label:favorites">♡</button></header><div class="notice" data-i18n="loadingPrices"></div><main><section class="hero"><div><small data-i18n="hero.kicker"></small><h1><span data-i18n="hero.line1"></span><br><span data-i18n="hero.line2"></span></h1><p data-i18n="hero.sub"></p><button id="browse-now" data-i18n="hero.cta"></button></div><div id="hero-art"></div></section><div id="categories"></div><section class="results"><div class="heading"><div><h2 id="list-title"></h2><p data-i18n="list.subtitle"></p></div><span id="result-count"></span></div><div id="products"></div></section><footer><span data-i18n="footer"></span> <button id="reset" data-i18n="reset"></button></footer></main><nav><button data-view="all" class="active"><span>⌂</span><i data-i18n="nav.discover"></i></button><button id="search-tab"><span>⌕</span><i data-i18n="nav.search"></i></button><button data-view="saved"><span>♡</span><i data-i18n="nav.saved"></i> <b id="count">0</b></button></nav></div><section id="detail" hidden data-i18n-attr="aria-label:detail.title"></section><dialog id="target-dialog"><form method="dialog"><button class="close-dialog" data-i18n-attr="aria-label:close">×</button></form><h2 data-i18n="dialog.title"></h2><p data-i18n="dialog.sub"></p><form id="target-form"><label for="target" data-i18n="dialog.label"></label><div class="inputrow"><input id
