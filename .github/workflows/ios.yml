name: Seoul Beauty iPhone Build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - 'dist/strings.json'
      - '.github/workflows/ios.yml'
  push:
    paths:
      - 'ios/**'
      - 'dist/strings.json'
      - '.github/workflows/ios.yml'
permissions:
  contents: read
concurrency:
  group: alimi-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Xcode project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xcodebuild -version | tee artifacts/environment.txt
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version | tee -a artifacts/environment.txt
          cd ios
          xcodegen generate
      - name: Start iPhone simulator boot (do not wait)
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > artifacts/simulators.json
          DEVICE_ID=$(python3 - <<'PY'
          import json
          data=json.load(open("artifacts/simulators.json"))
          choices=[d for runtime,devices in data["devices"].items() if ".iOS-" in runtime for d in devices if d.get("isAvailable") and d["name"].startswith("iPhone")]
          if not choices: raise SystemExit("No available iPhone simulator")
          print(choices[0]["udid"])
          PY
          )
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
      - name: Restore incremental build cache
        uses: actions/cache@v4
        with:
          path: build/Build/Intermediates.noindex
          key: ios-intermediates-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ios/**', 'dist/strings.json') }}
          restore-keys: |
            ios-intermediates-${{ runner.os }}-${{ runner.arch }}-
      - name: Build app and tests while simulator boots
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -project ios/Alimi.xcodeproj -scheme Alimi -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee artifacts/xcodebuild-build.log
      - name: Wait for simulator and run XCTest
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild test-without-building -project ios/Alimi.xcodeproj -scheme Alimi -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build -resultBundlePath artifacts/Alimi.xcresult -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee artifacts/xcodebuild-test.log
      - name: Launch and capture home screen
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl install "$DEVICE_ID" build/Build/Products/Debug-iphonesimulator/Alimi.app
          xcrun simctl launch "$DEVICE_ID" com.yohan4477.seoulbeauty -disableEvents
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot artifacts/alimi-iphone-home.png
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/Alimi.app artifacts/Alimi-simulator.zip
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alimi-ios-validation
          path: artifacts/
          retention-days: 3
