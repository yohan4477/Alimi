name: Stylevana official feed refresh
on:
  # Hourly trigger comes from Supabase pg_cron (feed-tick Edge Function) with force=false; GitHub's own
  # cron is best-effort, so it only remains as a 6-hourly fallback. Manual runs default to force=true.
  workflow_dispatch:
    inputs:
      force:
        description: Download even if Awin has not imported a new feed
        type: boolean
        default: true
  schedule:
    - cron: '35 */6 * * *'
permissions:
  contents: write
concurrency:
  group: stylevana-feed
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check whether Awin imported a new feed
        id: status
        env:
          AWIN_FEED_URL: ${{ secrets.AWIN_STYLEVANA_US_FEED_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE_DOWNLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: node scripts/awin-feed-status.mjs
      - name: Restore previously collected history
        if: steps.status.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          data_branch_sha=$(git ls-remote --heads origin refs/heads/data/stylevana-us | cut -f1)
          echo "DATA_BRANCH_SHA=$data_branch_sha" >> "$GITHUB_ENV"
          if [ -n "$data_branch_sha" ]; then
            git fetch --no-tags origin refs/heads/data/stylevana-us
            git restore --source=FETCH_HEAD -- data/stylevana-us.json dist/stylevana-data.js ios/Alimi/stylevana-us.json
          fi
      - name: Import official US feed
        if: steps.status.outputs.changed == 'true'
        env:
          AWIN_FEED_URL: ${{ secrets.AWIN_STYLEVANA_US_FEED_URL }}
        run: node scripts/stylevana-feed.mjs
      - run: npm test
        if: steps.status.outputs.changed == 'true'
      - name: Preserve collected snapshots
        if: steps.status.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add data/stylevana-us.json dist/stylevana-data.js ios/Alimi/stylevana-us.json
          if git diff --cached --quiet; then exit 0; fi
          git switch -c "collection-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: refresh official Stylevana US snapshot'
          git push --force-with-lease="refs/heads/data/stylevana-us:${DATA_BRANCH_SHA}" origin HEAD:refs/heads/data/stylevana-us
          echo "Official feed collected, validated and saved to [data/stylevana-us](https://github.com/yohan4477/Alimi/tree/data/stylevana-us)." >> "$GITHUB_STEP_SUMMARY"
          echo "Review [the snapshot comparison](https://github.com/yohan4477/Alimi/compare/main...data/stylevana-us) before updating the bundled app data. No automatic deployment." >> "$GITHUB_STEP_SUMMARY"
      - name: Record observation in Supabase
        if: steps.status.outputs.changed == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/supabase-sink.mjs data/stylevana-us.json
      - name: Record ten-product catalog in Supabase
        if: steps.status.outputs.changed == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/stylevana-catalog.mjs .private/stylevana.csv.gz
