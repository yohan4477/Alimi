name: Stylevana official feed refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * *'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: stylevana-feed
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import official US feed
        env:
          AWIN_FEED_URL: ${{ secrets.AWIN_STYLEVANA_US_FEED_URL }}
        run: node scripts/stylevana-feed.mjs
      - run: npm test
      - name: Propose updated snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git add data/stylevana-us.json dist/stylevana-data.js ios/Alimi/stylevana-us.json
          if git diff --cached --quiet; then exit 0; fi
          branch="data/stylevana-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: refresh official Stylevana US snapshot'
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title 'data: Stylevana US official feed refresh' --body 'Daily official feed collection. Checkout shipping and tax remain unverified. Review and merge to update bundled app snapshots.'
