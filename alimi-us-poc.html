<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alimi · US 구매 PoC</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#182239;font:15px/1.6 Arial,'Apple SD Gothic Neo',sans-serif}main{max-width:980px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{letter-spacing:-1px;margin:0;font-size:30px}h2{font-size:24px;line-height:1.3;margin:10px 0}h3{font-size:16px;margin:10px 0}p{margin:8px 0}.muted{color:#626e82;font-size:13px}.badge{background:#e9effb;color:#34538b;border-radius:6px;padding:3px 7px;font-size:12px}.notice{background:#fff3d9;padding:12px 16px;border-radius:12px;margin:18px 0;font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button,input,select{font:inherit;min-height:44px;border:1px solid #d7deea;background:#fff;color:inherit;border-radius:10px;padding:10px 12px}button,a{touch-action:manipulation}button{cursor:pointer}button.active,.primary{background:#264e91;color:#fff;border-color:#264e91}button:disabled{opacity:.5;cursor:default}input[type=search]{flex:1;min-width:160px}.layout{display:grid;grid-template-columns:280px 1fr;gap:20px}.panel{background:#fff;padding:20px;border-radius:16px}.product{display:block;width:100%;text-align:left;margin-bottom:8px;background:#fff;border:1px solid #e1e5ee}.product strong,.product small{display:block}.product.selected{border:2px solid #345ca0;background:#edf3ff}.price{font-size:32px;font-weight:700;letter-spacing:-1px}.offer{border-top:1px solid #e7eaf0;padding:15px 0}.offer-top{display:flex;justify-content:space-between;gap:12px}a{color:#245394}.buy{display:inline-block;padding:10px 14px;background:#edf2fa;border-radius:9px;text-decoration:none;margin-top:10px}.target{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.target input{width:140px;flex:1}.sim-controls{display:flex;gap:8px;flex-wrap:wrap}.status{padding:12px;background:#edf4fb;border-radius:10px;margin-top:12px}#toast{min-height:24px;color:#355c36;margin:8px 0}.empty{padding:20px 0;color:#647188}.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}details{margin-top:18px}summary{cursor:pointer;padding:10px 0}svg{width:100%;height:140px}footer{margin-top:20px;font-size:12px;color:#657187}@media(max-width:650px){main{padding:14px}.layout{grid-template-columns:1fr}#catalog{display:grid;grid-template-columns:1fr 1fr;gap:8px}.product{margin:0;padding:10px}.product strong{font-size:13px}.product small{font-size:12px}h2{font-size:22px}.panel{padding:16px}}@media(max-width:360px){#catalog{grid-template-columns:1fr}}
</style></head><body><main>
<header><h1>alimi.</h1><span class="badge">US · USD · PoC</span></header>
<div class="notice" id="notice">실제 관측 1건 · 자동 갱신 없음 · 배송비/세금 미확정 · 푸시 미연결</div>
<div class="toolbar"><button id="actual" class="active">실제 관측</button><button id="demo">흐름 체험 · 가상 가격</button><input id="search" type="search" aria-label="상품 검색" placeholder="브랜드·상품 검색"><button id="watch">관심만</button></div>
<div class="layout"><section><h3 id="count">상품 10개</h3><div id="catalog"></div></section><section class="panel" id="detail"></section></div>
<div id="toast" role="status" aria-live="polite"></div>
<details><summary>PoC 기록 · 이 브라우저에서만</summary><div class="stats" id="stats"></div><button id="export">실험 기록 JSON 저장</button><p class="muted">상품 선택·목표가 저장·구매처 클릭을 기기 안에 기록합니다. 서버 전송과 구매 완료 추적은 없습니다.</p></details>
<footer>실제 관측 모드와 체험 모드는 목표가·관심 저장을 분리합니다. 실제 관측: 2026-10-15 공개 페이지 확인값. 최신 가격·재고·배송 가능 여부는 판매처에서 확인하세요. 제휴 수수료 링크 아님.</footer>
</main><script>
'use strict';
const products=[
['cosrx','COSRX','Advanced Snail 96 Mucin Power Essence','100 ml',17.50,'스네일 뮤신 에센스'],
['boj','Beauty of Joseon','Relief Sun Rice + Probiotics','50 ml',16,'조선미녀 선크림'],
['anua','Anua','Heartleaf 77 Soothing Toner','250 ml',20,'아누아 어성초 토너'],
['roundlab','Round Lab','1025 Dokdo Toner','200 ml',17,'라운드랩 독도'],
['torriden','Torriden','DIVE-IN Serum','50 ml',18,'토리든 다이브인 세럼'],
['skin1004','SKIN1004','Madagascar Centella Ampoule','55 ml',15,'스킨1004 앰플'],
['laneige','Laneige','Lip Sleeping Mask Berry','20 g',20,'라네즈 립마스크'],
['innisfree','Innisfree','Retinol Cica Repair Ampoule','30 ml',26,'이니스프리 레티놀'],
['drjart','Dr.Jart+','Cicapair Cream','50 ml',30,'닥터자르트 시카'],
['aestura','Aestura','Atobarrier365 Cream','80 ml',28,'에스트라 아토베리어']
].map(([id,brand,name,size,base,keywords])=>({id,brand,name,size,base,keywords}));
const sources=[{name:'Stylevana US',price:17.50,url:'https://www.stylevana.com/en_US/cosrx-advanced-snail-96-mucin-power-essence-100ml10777.html',note:'2026-10-15 수동 관측 · USD 상품가. 배송비·세금·재고 미확정.'},{name:'iHerb',price:null,url:'https://www.iherb.com/pr/cosrx-advanced-snail-96-mucin-power-essence-3-38-fl-oz-100-ml/77208',note:'동일 상품 페이지 확인. 지역 전환으로 미국 가격은 확인하지 못함.'}];
let mode='actual',selected='cosrx',favoritesOnly=false,sim={},state={actual:{targets:{},favorites:[]},demo:{targets:{},favorites:[]},events:[]};
const valid=v=>typeof v==='number'&&Number.isFinite(v)&&v>0&&v<=10000;
try{const s=JSON.parse(localStorage.getItem('alimi-us-poc-v1'));if(s){for(const m of ['actual','demo']){state[m].targets=Object.fromEntries(Object.entries(s[m]?.targets||{}).filter(([id,v])=>products.some(p=>p.id===id)&&valid(v)));state[m].favorites=Array.isArray(s[m]?.favorites)?s[m].favorites.filter(id=>products.some(p=>p.id===id)):[];}state.events=Array.isArray(s.events)?s.events.filter(e=>e&&typeof e.type==='string').slice(-500):[];}}catch{}
const $=id=>document.getElementById(id),money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(v);
function save(){try{localStorage.setItem('alimi-us-poc-v1',JSON.stringify(state));return true;}catch{$('toast').textContent='저장소를 사용할 수 없어 이번 화면에서만 유지됩니다.';return false;}}
function event(type,extra={}){state.events.push({type,product:selected,mode,at:new Date().toISOString(),...extra});state.events=state.events.slice(-500);save();stats();}
function stats(){const types=[['select','상품 선택'],['target','목표가 저장'],['outbound','판매처 클릭']];$('stats').replaceChildren(...types.map(([k,label])=>{const e=document.createElement('span');e.textContent=label+' '+state.events.filter(e=>e.type===k).length+'회';return e;}));}
function demoOffers(p){return [{name:'데모 판매처 A',price:sim[p.id]??p.base,shipping:5},{name:'데모 판매처 B',price:p.base+2,shipping:0}].map(o=>({...o,total:o.price+o.shipping})).sort((a,b)=>a.total-b.total);}
function renderList(){const q=$('search').value.toLowerCase().trim();const list=products.filter(p=>(!favoritesOnly||state[mode].favorites.includes(p.id))&&[p.brand,p.name,p.keywords].join(' ').toLowerCase().includes(q));$('count').textContent='상품 '+list.length+'개';$('catalog').replaceChildren();for(const p of list){const b=document.createElement('button');b.className='product'+(p.id===selected?' selected':'');b.setAttribute('aria-pressed',String(p.id===selected));const strong=document.createElement('strong');strong.textContent=p.brand;const small=document.createElement('small');small.textContent=p.name+' · '+p.size;b.append(strong,small);b.onclick=()=>{selected=p.id;event('select');render();};$('catalog').append(b);}if(!list.length)$('catalog').textContent='일치하는 상품이 없습니다.';}
function render(){renderList();const p=products.find(p=>p.id===selected),s=state[mode],target=s.targets[p.id],actual=mode==='actual',known=actual&&p.id==='cosrx',offers=actual?(known?sources:[]):demoOffers(p),current=actual?(known?17.5:null):Math.min(...offers.map(o=>o.price));
$('actual').classList.toggle('active',actual);$('demo').classList.toggle('active',!actual);$('watch').classList.toggle('active',favoritesOnly);$('notice').textContent=actual?'실제 관측 1건 · 자동 갱신 없음 · 배송비/세금 미확정 · 푸시 미연결':'체험 모드 · 모든 가격·배송비·이력은 가상이며 실제 판매 조건이 아닙니다.';
$('detail').innerHTML=`<span class="badge">${actual?'공개 페이지 관측':'가상 데이터'}</span><p class="muted">${p.brand} · ${p.size} · 단품</p><h2>${p.name}</h2><div class="offer-top"><div><span class="muted">${actual?'관측된 상품가':'데모 최저 상품가'}</span><div class="price">${current===null?'확인 대기':money(current)}</div></div><button id="favorite">${s.favorites.includes(p.id)?'♥ 관심 해제':'♡ 관심 저장'}</button></div><p class="muted">${actual?'배송비·세금 제외. 총액 기준 최저가로 판단할 수 없습니다.':'판매처는 배송비 포함 세전 합계 순입니다. 목표가는 상품가 기준입니다.'}</p><h3>가격 흐름</h3><div id="history"></div><h3>판매처 비교</h3><div id="offers"></div><h3>원하는 상품가</h3><form id="target-form" class="target"><input id="target" type="number" min="0.01" max="10000" step="0.01" inputmode="decimal" aria-label="목표 상품가 USD" placeholder="USD" value="${target??''}" required><button class="primary" type="submit">목표가 저장</button><button id="remove" type="button">삭제</button></form><div class="status" id="target-status" role="status"></div><p class="muted">${actual?'목표가만 이 기기에 저장합니다. 자동 감시·푸시는 아직 연결되지 않았습니다.':'앱 내 알림 상태만 체험합니다. 실제 푸시는 발송하지 않습니다.'}</p>${!actual?'<div class="sim-controls"><button id="drop">가격 하락 체험 −$3</button><button id="reset">가격 복원</button></div>':''}`;
const history=$('history');if(actual){history.innerHTML=known?'<p class="muted">2026-10-15 · $17.50 — 관측 1건</p><p class="muted">추가 관측 전까지 추세 그래프를 만들지 않습니다.</p>':'<p class="empty">아직 관측 이력이 없습니다.</p>';}else{const values=Array.from({length:8},(_,i)=>p.base+3-i*.4+Math.sin(i)*1.2);values.push(current);const lo=Math.min(...values)-1,hi=Math.max(...values)+1;const pts=values.map((v,i)=>`${45+i*32},${110-(v-lo)/(hi-lo)*85}`).join(' ');history.innerHTML=`<svg viewBox="0 0 340 140" role="img" aria-label="가상 상품가 9개 관측의 흐름. 실제 이력 아님"><text x="0" y="18" fill="#53627b" font-size="12">USD</text><text x="0" y="35" fill="#53627b" font-size="11">${hi.toFixed(0)}</text><text x="0" y="110" fill="#53627b" font-size="11">${lo.toFixed(0)}</text><line x1="40" y1="115" x2="330" y2="115" stroke="#dce1e9"/><polyline points="${pts}" fill="none" stroke="#365da1" stroke-width="3"/><text x="45" y="135" font-size="12" fill="#53627b">가상 관측 1</text><text x="250" y="135" font-size="12" fill="#53627b">가상 관측 9</text></svg>`;}
if(!offers.length)$('offers').innerHTML='<p class="empty">실제 판매처·가격 확인 대기. 흐름 체험 모드에서 비교와 목표가를 테스트하세요.</p>';
for(const o of offers){const row=document.createElement('div');row.className='offer';row.innerHTML=`<div class="offer-top"><strong>${o.name}</strong><strong>${o.price===null?'가격 미확인':money(o.price)}</strong></div><p class="muted">${actual?o.note:'상품 '+money(o.price)+' + 가상 배송비 '+money(o.shipping)+' = 세전 '+money(o.total)}</p>`;if(actual){const a=document.createElement('a');a.className='buy';a.textContent='판매처에서 현재 조건 확인 ↗';a.href=o.url;a.target='_blank';a.rel='noopener noreferrer';a.onclick=()=>event('outbound',{retailer:o.name});row.append(a);}else{const b=document.createElement('button');b.textContent='구매 이동 체험';b.onclick=()=>{event('demo_outbound',{retailer:o.name});$('toast').textContent='가상 판매처입니다. 실제 결제 페이지로 이동하지 않습니다.';};row.append(b);}$('offers').append(row);}
$('target-status').textContent=!target?'목표가를 설정하세요.':current===null?'목표가 '+money(target)+' 저장 · 실제 가격 확인 대기':actual?'목표가 '+money(target)+' 저장 · 과거 관측값 '+(current<=target?'이하':'초과')+' (현재 도달 여부 미확인)':current<=target?'체험 알림: 목표가 도달! '+money(current):'기다리는 중 · 목표 '+money(target);
$('favorite').onclick=()=>{s.favorites=s.favorites.includes(p.id)?s.favorites.filter(id=>id!==p.id):[...s.favorites,p.id];save();render();};
$('target-form').onsubmit=e=>{e.preventDefault();const raw=$('target').value,n=Number(raw);if(!/^\d+(\.\d{1,2})?$/.test(raw)||!valid(n)){ $('toast').textContent='$0.01~$10,000, 소수 둘째 자리까지 입력하세요.';return;}s.targets[p.id]=n;event('target',{target:n});render();};$('remove').onclick=()=>{delete s.targets[p.id];save();render();};if(!actual){$('drop').onclick=()=>{sim[p.id]=Math.max(.01,Math.round(((sim[p.id]??p.base)-3)*100)/100);render();};$('reset').onclick=()=>{delete sim[p.id];render();};}stats();}
$('actual').onclick=()=>{mode='actual';$('toast').textContent='';render();};$('demo').onclick=()=>{mode='demo';$('toast').textContent='';render();};$('watch').onclick=()=>{favoritesOnly=!favoritesOnly;render();};$('search').oninput=renderList;
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({schema:1,exportedAt:new Date().toISOString(),state,limits:'Local events only; no purchases or commissions measured'},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='alimi-poc-events.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};
render();
</script></body></html>
